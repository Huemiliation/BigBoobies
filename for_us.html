        // =============================================
        //  EMOJI CONFETTI — physics-based bouncy emojis
        //  Pop out of the dancer, bounce across the screen with gravity,
        //  and disappear when they fall off-screen.
        // =============================================
        var CONFETTI_SIZES = ['size-lg', 'size-md', 'size-sm', 'size-xs', 'size-tiny'];
        // Weighted toward smaller sizes so the burst feels like a sparkling spray
        var CONFETTI_SIZE_WEIGHTS = [0.15, 0.25, 0.3, 0.2, 0.1];

        function pickWeighted(weights) {
            var r = Math.random(), acc = 0;
            for (var i = 0; i < weights.length; i++) {
                acc += weights[i];
                if (r < acc) return i;
            }
            return weights.length - 1;
        }

        // Emoji "confetti" mixes — the dancer's own emoji plus a festive variety
        var CONFETTI_EMOJIS_WAFFLE = ['🧇', '🍯', '🧈', '🍓', '🥞', '🎉', '✨', '💛', '🌟', '🧇'];
        var CONFETTI_EMOJIS_PEACH  = ['🍑', '🌸', '💖', '🌷', '💐', '🎉', '✨', '💗', '🌟', '🍑'];

        // --- Physics-based emoji bouncer ---
        var emojiBouncers = [];
        var emojiPhysicsRunning = false;
        var emojiLastTime = 0;

        function EmojiBouncer(x, y, emoji, glowClass, sizeClass) {
            this.x = x;
            this.y = y;
            // Strong outward + upward pop
            var angle = Math.random() * Math.PI * 2;
            var power = 6 + Math.random() * 10;          // 6–16 px/frame initial speed
            this.vx = Math.cos(angle) * power;
            this.vy = Math.sin(angle) * power - 8;       // bias upward
            this.gravity = 0.42;
            this.bounce = 0.62;                          // energy retained on floor bounce
            this.rotation = Math.random() * 360;
            this.rotSpeed = (Math.random() - 0.5) * 14;
            this.bounces = 0;
            this.maxBounces = 2 + Math.floor(Math.random() * 2); // 2–3 bounces then fall through
            this.life = 0;
            this.maxLife = 4500;
            this.alive = true;

            var el = document.createElement('div');
            el.className = 'emoji-confetti ' + glowClass + ' ' + sizeClass;
            el.textContent = emoji;
            el.style.left = '0px';
            el.style.top = '0px';
            el.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(0deg)';
            document.body.appendChild(el);
            this.element = el;
        }

        EmojiBouncer.prototype.update = function(dt) {
            // dt is in ms; normalise to ~60fps frame factor
            var f = dt / 16.67;
            this.vy += this.gravity * f;
            this.x += this.vx * f;
            this.y += this.vy * f;
            this.rotation += this.rotSpeed * f;
            this.life += dt;

            var floorY = window.innerHeight - 20;
            // Bounce off floor (until maxBounces reached, then fall through)
            if (this.y > floorY && this.vy > 0 && this.bounces < this.maxBounces) {
                this.y = floorY;
                this.vy = -this.vy * this.bounce;
                this.vx *= 0.82;
                this.rotSpeed *= 0.75;
                this.bounces++;
            }

            // Bounce off side walls softly
            if (this.x < 0 && this.vx < 0) { this.x = 0; this.vx = -this.vx * 0.7; }
            if (this.x > window.innerWidth && this.vx > 0) { this.x = window.innerWidth; this.vx = -this.vx * 0.7; }

            // Remove when below screen (after bounces exhausted) or life over
            if (this.y > window.innerHeight + 60 || this.life > this.maxLife) {
                this.alive = false;
                return;
            }

            // Fade out in the last 600ms of life
            var opacity = 1;
            if (this.life > this.maxLife - 600) {
                opacity = Math.max(0, (this.maxLife - this.life) / 600);
            }
            // Also start fading after last bounce as it falls away
            if (this.bounces >= this.maxBounces && this.vy > 0) {
                opacity = Math.min(opacity, Math.max(0, 1 - (this.y - floorY) / 100));
            }

            this.element.style.transform =
                'translate(' + this.x + 'px,' + this.y + 'px) rotate(' + this.rotation + 'deg)';
            this.element.style.opacity = opacity;
        };

        EmojiBouncer.prototype.destroy = function() {
            if (this.element && this.element.parentNode) {
                this.element.parentNode.removeChild(this.element);
            }
        };

        function animateEmojiPhysics(time) {
            if (emojiBouncers.length === 0) {
                emojiPhysicsRunning = false;
                return;
            }
            var dt = Math.min(50, time - emojiLastTime); // clamp dt to avoid jumps after tab switch
            emojiLastTime = time;
            for (var i = emojiBouncers.length - 1; i >= 0; i--) {
                emojiBouncers[i].update(dt);
                if (!emojiBouncers[i].alive) {
                    emojiBouncers[i].destroy();
                    emojiBouncers.splice(i, 1);
                }
            }
            requestAnimationFrame(animateEmojiPhysics);
        }

        function startEmojiPhysics() {
            if (!emojiPhysicsRunning) {
                emojiPhysicsRunning = true;
                emojiLastTime = performance.now();
                requestAnimationFrame(animateEmojiPhysics);
            }
        }

        function spawnEmojiConfetti(dancerEl, emojis, glowClass) {
            if (!dancerEl) return;
            var rect = dancerEl.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;

            var count = 18 + Math.floor(Math.random() * 8); // 18–25 bouncy emojis
            for (var i = 0; i < count; i++) {
                var emoji = emojis[Math.floor(Math.random() * emojis.length)];
                var sizeIdx = pickWeighted(CONFETTI_SIZE_WEIGHTS);
                var sizeClass = CONFETTI_SIZES[sizeIdx];
                emojiBouncers.push(new EmojiBouncer(cx, cy, emoji, glowClass, sizeClass));
            }
            startEmojiPhysics();
        }

        // Click/tap handlers on the dancers
        function setupDancerClicks() {
            function handleDancerClick(dancerEl, emojis, glowClass) {
                return function(e) {
                    e.stopPropagation();
                    spawnEmojiConfetti(dancerEl, emojis, glowClass);
                    if (navigator.vibrate) navigator.vibrate(35);
                };
            }
            dancerWaffle.addEventListener('click', handleDancerClick(dancerWaffle, CONFETTI_EMOJIS_WAFFLE, 'glow-waffle'));
            dancerPeach.addEventListener('click', handleDancerClick(dancerPeach, CONFETTI_EMOJIS_PEACH, 'glow-peach'));
            // Touch support (the dancers are pointer-events:auto when active)
            dancerWaffle.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                spawnEmojiConfetti(dancerWaffle, CONFETTI_EMOJIS_WAFFLE, 'glow-waffle');
                if (navigator.vibrate) navigator.vibrate(35);
            }, { passive: false });
            dancerPeach.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                spawnEmojiConfetti(dancerPeach, CONFETTI_EMOJIS_PEACH, 'glow-peach');
                if (navigator.vibrate) navigator.vibrate(35);
            }, { passive: false });
        }
        setupDancerClicks();

        // =============================================
        //  RANDOM BARREL ROLLS — waffle & peach occasionally spin 360°
        // =============================================
        var barrelRollTimer = null;
        function triggerBarrelRoll(dancerEl) {
            if (!dancerEl) return;
            var inner = dancerEl.querySelector('.dancer-inner');
            if (!inner) return;
            inner.classList.remove('barrel-rolling');
            // Force reflow so the animation can restart
            void inner.offsetWidth;
            inner.classList.add('barrel-rolling');
            setTimeout(function() { inner.classList.remove('barrel-rolling'); }, 850);
        }
        function scheduleBarrelRoll() {
            var delay = 2800 + Math.random() * 4500; // 2.8–7.3s between rolls
            barrelRollTimer = setTimeout(function() {
                // Pick waffle or peach at random
                var target = Math.random() < 0.5 ? dancerWaffle : dancerPeach;
                triggerBarrelRoll(target);
                scheduleBarrelRoll(); // schedule the next one
            }, delay);
        }

        // =============================================
        //  HAPP BIRTHDAY HAPTIC SONG
        //  Plays the rhythm of "Happy Birthday" via phone vibration.
        //  navigator.vibrate only supports duration (no intensity),
        //  so we vary vibrate/pause lengths to match the melody rhythm.
        // =============================================
        function playHappyBirthdayHaptics() {
            if (!navigator.vibrate) return;
            // Rhythm units (ms)
            var eighth = 170, quarter = 340, half = 680, whole = 1050;
            var gap = 60, phraseGap = 260;

            // "Happy birthday to you"  (6 notes: eighth-eighth-quarter-quarter-quarter-half)
            var phrase = [eighth, gap, eighth, gap, quarter, gap, quarter, gap, quarter, gap, half, phraseGap];
            // "Happy birthday dear Heliaaa" (7 notes, last one held)
            var phraseLong = [eighth, gap, eighth, gap, quarter, gap, quarter, gap, quarter, gap, quarter, gap, half, phraseGap];
            // "Happy birthday to you" final (ends with a longer whole note)
            var phraseEnd = [eighth, gap, eighth, gap, quarter, gap, quarter, gap, quarter, gap, whole];

            var pattern = phrase.concat(phrase).concat(phraseLong).concat(phraseEnd);
            navigator.vibrate(pattern);
        }

        // =============================================
        //  CELEBRATION — smooth cross-fade transition
        // =============================================
        function onAllCandlesOut() {
            if (celebrationDone) return;
            celebrationDone = true;

            stopListening();
            wishBtn.disabled = true;
            wishBtn.innerHTML =
                '<span class="sparkle-left">✦</span>' +
                '✨ Your wish will come true ✨' +
                '<span class="sparkle-right">✦</span>';
            blowHint.classList.remove('show');
            blowMeter.classList.remove('show');

            // Play the Happy Birthday song via haptic vibrations
            playHappyBirthdayHaptics();

            // Start spawning petals (they fade in smoothly from here)
            startPetalSpawn();

            // Burst of confetti at cake position
            var cakeRect = cakeSection.getBoundingClientRect();
            spawnConfetti(cakeRect.left + cakeRect.width / 2, cakeRect.top + cakeRect.height / 2, 80);

            // Fireworks cascade
            launchFireworks();
            setTimeout(launchFireworks, 1200);
            setTimeout(launchFireworks, 2800);
            setTimeout(launchFireworks, 4200);

            // Start dance party (overlaps with transition)
            setTimeout(startDanceParty, 500);

            // PHASE 1: Cake fades out (smooth) + prelude elements fade out
            setTimeout(function() {
                cakeSection.classList.add('leaving');
                contentEl.classList.add('faded');
            }, 700);

            // PHASE 2: After cake is gone, cross-fade message in
            setTimeout(function() {
                cakeSection.classList.add('hidden');
                // Show message and force reflow so transition triggers
                messageSection.style.display = 'flex';
                void messageSection.offsetWidth; // force reflow
                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        messageSection.classList.add('show');
                    });
                });
                typeMessage(BIRTHDAY_MESSAGE, function() {
                    setTimeout(function() {
                        replayBtn.classList.add('show');
                    }, 500);
                });
            }, 1700); // 700ms wait + 900ms cake transition + 100ms buffer
        }

        // =============================================
        //  TYPEWRITER MESSAGE
        // =============================================
        function typeMessage(text, onDone) {
            var el = document.getElementById('message-text');
            var i = 0;
            var cursor = '<span class="typed-cursor"></span>';
            function type() {
                if (i < text.length) {
                    el.innerHTML = text.substring(0, i + 1) + cursor;
                    i++;
                    setTimeout(type, Math.random() * 40 + 30);
                } else {
                    setTimeout(function() {
                        el.innerHTML = text;
                        if (typeof onDone === 'function') onDone();
                    }, 1800);
                }
            }
            type();
        }

        // =============================================
        //  REPLAY — reverse transition
        // =============================================
        replayBtn.addEventListener('click', function() {
            // Stop dance party
            danceStage.classList.remove('active');
            if (partyTrailTimer) { clearInterval(partyTrailTimer); partyTrailTimer = null; }
            if (barrelRollTimer) { clearTimeout(barrelRollTimer); barrelRollTimer = null; }
            danceStage.querySelectorAll('.party-trail').forEach(function(t) { t.remove(); });

            // Stop haptics (cancel any ongoing vibration pattern)
            if (navigator.vibrate) navigator.vibrate(0);

            // Clear all petals + bouncy emojis (optimisation: frees the rAF loops)
            clearAllPetals();
            for (var i = emojiBouncers.length - 1; i >= 0; i--) { emojiBouncers[i].destroy(); }
            emojiBouncers.length = 0;

            // Phase 1: message fades out + prelude elements fade back in
            messageSection.classList.remove('show');
            replayBtn.classList.remove('show');
            contentEl.classList.remove('faded');

            // Phase 2: after message gone, show cake again
            setTimeout(function() {
                messageSection.style.display = 'none';

                // Reset state
                celebrationDone = false;
                candlesOut = 0;
                isBlowing = false;
                updateCounter();
                resetProgressEffects();

                // Re-light all flames
                allFlames.forEach(function(f) { f.classList.remove('out'); });

                // Reset UI
                wishBtn.disabled = false;
                wishBtn.innerHTML =
                    '<span class="sparkle-left">✦</span>' +
                    'Make a wish and press me' +
                    '<span class="sparkle-right">✦</span>';
                blowHint.textContent = 'Each blow puts out one candle!';

                // Show cake (reverse the leaving state smoothly)
                cakeSection.classList.remove('hidden');
                void cakeSection.offsetWidth; // force reflow
                requestAnimationFrame(function() {
                    cakeSection.classList.remove('leaving');
                });
            }, 900);
        });

        // =============================================
        //  SAKURA PETAL SYSTEM
        //  Colors expand (magenta, rose, wine red, pink) and count
        //  grows as more candles are blown out.
        // =============================================
        var sakuraCanvas = document.getElementById('sakura-canvas');
        var sCtx = sakuraCanvas.getContext('2d');
        var sWidth, sHeight;
        var petals = [];

        // Petal palette tiers — unlocked gradually as progress increases.
        // Tier 0 (start): soft pinks
        var PETAL_COLORS_TIER0 = ['#ffb7c5', '#ffc1cc', '#f8bbd0', '#ffd1dc', '#fce4ec'];
        // Tier 1 (~25%): add brighter pinks + rose
        var PETAL_COLORS_TIER1 = ['#ffb7c5', '#ffc1cc', '#f8bbd0', '#ffd1dc', '#fce4ec', '#ff6b9d', '#ff4081'];
        // Tier 2 (~50%): add magenta + wine red
        var PETAL_COLORS_TIER2 = ['#ffb7c5', '#ffc1cc', '#f8bbd0', '#ffd1dc', '#fce4ec', '#ff6b9d', '#ff4081', '#e91e63', '#ad1457', '#880e4f'];
        // Tier 3 (~75%+): full rich palette (deep wine + magenta dominant)
        var PETAL_COLORS_TIER3 = ['#ff6b9d', '#ff4081', '#e91e63', '#c2185b', '#ad1457', '#880e4f', '#ec407a', '#d81b60', '#ff80ab', '#f48fb1'];

        // Base vs max petal counts (scaled by viewport)
        var BASE_PETALS = window.innerWidth < 500 ? 22 : 36;
        var MAX_PETALS_CAP = window.innerWidth < 500 ? 80 : 130;

        function getActivePetalColors() {
            var progress = candlesOut / totalCandles;
            if (progress >= 0.75) return PETAL_COLORS_TIER3;
            if (progress >= 0.5)  return PETAL_COLORS_TIER2;
            if (progress >= 0.25) return PETAL_COLORS_TIER1;
            return PETAL_COLORS_TIER0;
        }

        function getTargetPetalCount() {
            var progress = candlesOut / totalCandles;
            return Math.round(BASE_PETALS + (MAX_PETALS_CAP - BASE_PETALS) * progress);
        }

        function resizeSakura() {
            sWidth = window.innerWidth; sHeight = window.innerHeight;
            sakuraCanvas.width = sWidth; sakuraCanvas.height = sHeight;
        }

        function Petal(initial) { this.reset(initial); }
        Petal.prototype.reset = function(initial) {
            this.x = Math.random() * sWidth;
            this.y = initial ? Math.random() * sHeight : -20;
            this.size = Math.random() * 8 + 5;
            this.speedY = Math.random() * 0.45 + 0.15;   // slower, gentler fall
            this.speedX = Math.random() * 0.3 - 0.15;    // less horizontal drift
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.02;
            this.wobbleSpeed = Math.random() * 0.015 + 0.008;
            this.wobbleOffset = Math.random() * Math.PI * 2;
            this.targetOpacity = Math.random() * 0.4 + 0.4;
            this.opacity = 0;                             // start invisible — fade in smoothly
            this.fadeInSpeed = 0.006 + Math.random() * 0.006; // per-frame fade rate
            this.color = getActivePetalColors()[Math.floor(Math.random() * getActivePetalColors().length)];
            this.type = Math.random() > 0.7 ? 'flower' : 'petal';
        };
        Petal.prototype.update = function(t) {
            this.y += this.speedY;
            this.x += this.speedX + Math.sin(t * this.wobbleSpeed + this.wobbleOffset) * 0.5;
            this.rotation += this.rotSpeed;
            // Smooth fade-in toward target opacity
            if (this.opacity < this.targetOpacity) {
                this.opacity += this.fadeInSpeed;
                if (this.opacity > this.targetOpacity) this.opacity = this.targetOpacity;
            }
            if (this.y > sHeight + 20) this.reset(false);
            if (this.x < -20) this.x = sWidth + 20;
            if (this.x > sWidth + 20) this.x = -20;
        };
        Petal.prototype.draw = function(ctx) {
            ctx.save();
            ctx.globalAlpha = this.opacity;
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.color;
            if (this.type === 'flower') {
                var s = this.size * 0.6;
                for (var i = 0; i < 5; i++) {
                    ctx.save(); ctx.rotate(i * 1.2566);
                    ctx.beginPath(); ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(s * 0.35, -s * 0.3, 0, -s * 0.6);
                    ctx.quadraticCurveTo(-s * 0.35, -s * 0.3, 0, 0);
                    ctx.fill(); ctx.restore();
                }
                ctx.fillStyle = '#fff'; ctx.globalAlpha = this.opacity * 0.8;
                ctx.beginPath(); ctx.arc(0, 0, s * 0.1, 0, 6.2832); ctx.fill();
            } else {
                var s2 = this.size;
                ctx.beginPath(); ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(s2 * 0.5, -s2 * 0.4, s2, 0);
                ctx.quadraticCurveTo(s2 * 0.5, s2 * 0.4, 0, 0);
                ctx.fill();
            }
            ctx.restore();
        };

        resizeSakura();
        // Petals do NOT spawn on load — they only appear (with a smooth fade-in)
        // after ALL candles are blown out, via startPetalSpawn().

        var petalSpawnTimer = null;
        var sakuraRunning = false;
        var sakuraTime = 0;

        // Begin gradually spawning petals (called from onAllCandlesOut).
        // Each new petal starts at opacity 0 and fades in smoothly.
        function startPetalSpawn() {
            var target = getTargetPetalCount();
            if (petalSpawnTimer) clearInterval(petalSpawnTimer);
            petalSpawnTimer = setInterval(function() {
                if (petals.length < target) {
                    petals.push(new Petal(false)); // spawn at top, fall down + fade in
                    if (!sakuraRunning) {
                        sakuraRunning = true;
                        requestAnimationFrame(animateSakura);
                    }
                } else {
                    clearInterval(petalSpawnTimer);
                    petalSpawnTimer = null;
                }
            }, 140); // one new petal every 140ms — gradual, never pops in
        }

        function clearAllPetals() {
            petals.length = 0;
            if (petalSpawnTimer) { clearInterval(petalSpawnTimer); petalSpawnTimer = null; }
            sakuraRunning = false;
            sCtx.clearRect(0, 0, sWidth, sHeight);
        }

        // (syncPetalsToProgress is no longer called during candle progress —
        //  petals only exist after the celebration begins.)
        function syncPetalsToProgress() { /* no-op — kept for safety */ }

        function animateSakura() {
            // Optimization: skip the loop entirely when there are no petals
            if (petals.length === 0) {
                sakuraRunning = false;
                return;
            }
            sCtx.clearRect(0, 0, sWidth, sHeight);
            sakuraTime++;
            for (var i = 0; i < petals.length; i++) {
                petals[i].update(sakuraTime);
                petals[i].draw(sCtx);
            }
            requestAnimationFrame(animateSakura);
        }
        window.addEventListener('resize', resizeSakura);

        // =============================================
        //  EFFECTS CANVAS (Confetti + Fireworks)
        // =============================================
        var fxCanvas = document.getElementById('effects-canvas');
        var fxCtx = fxCanvas.getContext('2d');
        var fxWidth, fxHeight;
        function resizeFx() {
            fxWidth = window.innerWidth; fxHeight = window.innerHeight;
            fxCanvas.width = fxWidth; fxCanvas.height = fxHeight;
        }
        window.addEventListener('resize', resizeFx);
        resizeFx();

        var confettiPieces = [];
        var CONFETTI_COLORS = ['#f06292', '#ec407a', '#ff80ab', '#ffb7c5', '#ffd54f', '#fff176', '#f8bbd0', '#ce93d8'];

        function ConfettiPiece(x, y) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 12;
            this.vy = (Math.random() - 1) * 10 - 3;
            this.w = Math.random() * 8 + 4;
            this.h = Math.random() * 4 + 2;
            this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
            this.rot = Math.random() * 6.28;
            this.rotSpd = (Math.random() - 0.5) * 0.3;
            this.gravity = 0.15;
            this.opacity = 1;
            this.decay = Math.random() * 0.005 + 0.008;
        }
        ConfettiPiece.prototype.update = function() {
            this.vy += this.gravity; this.x += this.vx; this.y += this.vy;
            this.vx *= 0.99; this.rot += this.rotSpd; this.opacity -= this.decay;
        };
        ConfettiPiece.prototype.draw = function(ctx) {
            if (this.opacity <= 0) return;
            ctx.save(); ctx.globalAlpha = this.opacity;
            ctx.translate(this.x, this.y); ctx.rotate(this.rot);
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
            ctx.restore();
        };

        function spawnConfetti(x, y, count) {
            for (var i = 0; i < (count || 18); i++) confettiPieces.push(new ConfettiPiece(x, y));
            startFxLoop();
        }

        var fireworkParticles = [];
        var FW_COLORS = ['#f06292', '#ff80ab', '#ffd54f', '#fff176', '#ce93d8', '#f48fb1', '#ffb7c5', '#ff8a80'];

        function FWParticle(x, y, color) {
            this.x = x; this.y = y;
            var angle = Math.random() * 6.28;
            var speed = Math.random() * 5 + 2;
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
            this.color = color; this.opacity = 1;
            this.decay = Math.random() * 0.015 + 0.01;
            this.size = Math.random() * 2.5 + 1;
        }
        FWParticle.prototype.update = function() {
            this.vy += 0.04; this.x += this.vx; this.y += this.vy;
            this.vx *= 0.98; this.vy *= 0.98; this.opacity -= this.decay;
        };
        FWParticle.prototype.draw = function(ctx) {
            if (this.opacity <= 0) return;
            ctx.save(); ctx.globalAlpha = this.opacity;
            ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, 6.28); ctx.fill();
            ctx.restore();
        };

        function launchFireworks() {
            var count = 4 + Math.floor(Math.random() * 3);
            for (var b = 0; b < count; b++) {
                (function(delay) {
                    setTimeout(function() {
                        var cx = Math.random() * fxWidth * 0.6 + fxWidth * 0.2;
                        var cy = Math.random() * fxHeight * 0.4 + fxHeight * 0.1;
                        var color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
                        for (var i = 0; i < 30 + Math.floor(Math.random() * 20); i++) {
                            fireworkParticles.push(new FWParticle(cx, cy, color));
                        }
                        startFxLoop();
                    }, delay);
                })(b * 300);
            }
        }

        var fxRunning = false;
        function animateEffects() {
            // Optimization: skip the loop entirely when there are no particles
            if (confettiPieces.length === 0 && fireworkParticles.length === 0) {
                fxRunning = false;
                return;
            }
            fxCtx.clearRect(0, 0, fxWidth, fxHeight);
            var i;
            for (i = confettiPieces.length - 1; i >= 0; i--) {
                confettiPieces[i].update(); confettiPieces[i].draw(fxCtx);
                if (confettiPieces[i].opacity <= 0) confettiPieces.splice(i, 1);
            }
            for (i = fireworkParticles.length - 1; i >= 0; i--) {
                fireworkParticles[i].update(); fireworkParticles[i].draw(fxCtx);
                if (fireworkParticles[i].opacity <= 0) fireworkParticles.splice(i, 1);
            }
            requestAnimationFrame(animateEffects);
        }
        function startFxLoop() {
            if (!fxRunning) {
                fxRunning = true;
                requestAnimationFrame(animateEffects);
            }
        }

        // Tap for confetti
        document.addEventListener('click', function(e) {
            if (e.target.closest('button')) return;
            spawnConfetti(e.clientX, e.clientY, 15);
        });
        document.addEventListener('touchstart', function(e) {
            if (e.target.closest('button')) return;
            var t = e.touches[0];
            if (t) spawnConfetti(t.clientX, t.clientY, 15);
        }, { passive: true });

        // Hide hint
        setTimeout(function() {
            var hint = document.getElementById('confetti-hint');
            if (hint) { hint.style.opacity = '0'; setTimeout(function() { if (hint) hint.remove(); }, 1000); }
        }, 8000);

        // =============================================
        //  ENTRANCE: trigger cake section fade-in on load
        // =============================================
        setTimeout(function() {
            cakeSection.classList.add('entered');
        }, 600);

    })();
    </script>
</body>
</html>
