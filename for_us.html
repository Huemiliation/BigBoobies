<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✶ Happy 21st Birthday, Helia! ✶</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           HELIA'S 21ST BIRTHDAY PAGE
           ============================================
           CUSTOMIZE: Name, date, message in the JS section
        */

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%;
            overflow-x: hidden; overflow-y: auto;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(160deg, #fff0f5 0%, #ffe4ec 30%, #ffd6e0 60%, #fff5f7 100%);
            color: #4a1942;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- CANVAS LAYERS --- */
        #sakura-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        #effects-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 100; }

        /* --- EDGE GLOW VISUALIZER --- */
        #edge-glow {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 90;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        #edge-glow.active { opacity: 1; }
        /* Conic gradient ring + inward box-shadow glow */
        #edge-glow-inner {
            position: absolute; inset: 0;
            --border-w: 5px;
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            mask-composite: exclude;
            padding: var(--border-w);
        }
        #edge-glow-fill {
            position: absolute; inset: 0;
        }
        /* Flash effect when candle goes out */
        #edge-glow.flash #edge-glow-fill {
            box-shadow: inset 0 0 120px 60px rgba(255, 255, 255, 0.7) !important;
            transition: none !important;
        }

        /* --- GLOW BLOBS --- */
        .glow-blob {
            position: fixed; border-radius: 50%;
            filter: blur(80px); opacity: 0.25;
            pointer-events: none; z-index: 1;
            animation: blobFloat 8s ease-in-out infinite alternate;
        }
        .glow-blob:nth-child(1) { width: 280px; height: 280px; background: #ffb7c5; top: -50px; left: -50px; }
        .glow-blob:nth-child(2) { width: 220px; height: 220px; background: #ffc1cc; bottom: -30px; right: -30px; animation-delay: -3s; }
        .glow-blob:nth-child(3) { width: 180px; height: 180px; background: #f8bbd0; top: 40%; left: 60%; animation-delay: -5s; }
        @keyframes blobFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.15); }
        }

        /* --- MAIN CONTENT --- */
        .content {
            position: relative; z-index: 10;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px 16px;
            gap: 18px;
        }

        /* --- NAME --- */
        .name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(40px, 10vw, 68px);
            color: #d6336c;
            text-shadow: 0 2px 20px rgba(214, 51, 108, 0.3);
            line-height: 1.2;
            animation: fadeSlideIn 1.5s ease-out;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .subtitle {
            font-size: clamp(13px, 3.2vw, 17px);
            color: #9c4466; font-weight: 500; text-align: center;
            animation: fadeSlideIn 1.5s ease-out 0.3s both;
        }

        /* --- COUNTDOWN --- */
        .countdown {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            animation: fadeSlideIn 1.5s ease-out 0.5s both;
        }
        .countdown-box {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 183, 197, 0.4);
            border-radius: 12px; padding: 10px 12px;
            min-width: 62px; text-align: center;
            box-shadow: 0 3px 16px rgba(214, 51, 108, 0.08);
        }
        .countdown-number {
            font-size: clamp(22px, 5.5vw, 32px);
            font-weight: 700; color: #d6336c; line-height: 1.1;
        }
        .countdown-label {
            font-size: 9px; font-weight: 600; color: #c97b93;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 3px;
        }

        /* --- BIRTHDAY BANNER --- */
        .birthday-banner {
            display: none;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(18px, 5vw, 30px); color: #d6336c;
            animation: bannerPulse 2s ease-in-out infinite;
        }
        .birthday-banner.show { display: block; }
        @keyframes bannerPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 20px rgba(214, 51, 108, 0.3); }
            50% { transform: scale(1.05); text-shadow: 0 0 40px rgba(214, 51, 108, 0.6); }
        }

        /* =============================================
           CAKE — 3-TIER WITH CANDLES PER LAYER
           Top: 4 candles | Mid: 7 candles | Bot: 10 candles = 21
           ============================================= */
        .cake-section {
            display: flex; flex-direction: column;
            align-items: center; gap: 12px;
            animation: fadeSlideIn 1.5s ease-out 0.7s both;
        }
        .cake-wrapper {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- CANDLES (shared) --- */
        .candles-row {
            display: flex; justify-content: center;
            position: relative; z-index: 3;
            margin-bottom: -3px;
        }
        .candle {
            display: flex; flex-direction: column;
            align-items: center; position: relative;
        }
        .candle-body {
            border-radius: 2px 2px 0 0; position: relative;
        }
        .candle-body::after {
            content: ''; position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px; border-radius: 0 0 2px 2px;
            background: rgba(0,0,0,0.08);
        }
        /* Per-tier candle sizing */
        .tier-candles-top .candle { width: 12px; }
        .tier-candles-top .candle-body { width: 6px; height: 22px; }
        .tier-candles-top .candles-row { gap: 10px; }

        .tier-candles-mid .candle { width: 12px; }
        .tier-candles-mid .candle-body { width: 6px; height: 18px; }
        .tier-candles-mid .candles-row { gap: 6px; }

        .tier-candles-bot .candle { width: 12px; }
        .tier-candles-bot .candle-body { width: 5px; height: 16px; }
        .tier-candles-bot .candles-row { gap: 4px; }

        /* Candle stripe colors */
        .candle:nth-child(6n+1) .candle-body { background: linear-gradient(180deg, #ffb7c5 0%, #ffa3b5 100%); }
        .candle:nth-child(6n+2) .candle-body { background: linear-gradient(180deg, #ffd1dc 0%, #ffbdcf 100%); }
        .candle:nth-child(6n+3) .candle-body { background: linear-gradient(180deg, #f8bbd0 0%, #f0a0b8 100%); }
        .candle:nth-child(6n+4) .candle-body { background: linear-gradient(180deg, #ffc1cc 0%, #f9a8b8 100%); }
        .candle:nth-child(6n+5) .candle-body { background: linear-gradient(180deg, #f48fb1 0%, #e87a9e 100%); }
        .candle:nth-child(6n+6) .candle-body { background: linear-gradient(180deg, #fce4ec 0%, #f5d0dc 100%); }

        /* WICK */
        .wick {
            width: 2px; height: 4px;
            background: #555; border-radius: 1px; margin-bottom: -1px;
        }

        /* FLAME */
        .flame-container {
            position: relative; width: 12px; height: 16px; margin-bottom: -2px;
        }
        .flame {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 6px; height: 12px;
            background: linear-gradient(to top, #ff6b35, #ffeb3b 40%, #fff 90%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker calc(0.2s + var(--fs, 0) * 0.15s) ease-in-out infinite alternate;
            filter: blur(0.3px);
            transition: all 0.3s ease;
            box-shadow: 0 0 6px 2px rgba(255, 200, 50, 0.6);
        }
        .flame::after {
            content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
            width: 8px; height: 5px;
            background: radial-gradient(ellipse, rgba(100, 180, 255, 0.35) 0%, transparent 70%);
            border-radius: 50%;
        }
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
            33% { transform: translateX(-50%) scale(1.1, 0.85) rotate(2deg); }
            66% { transform: translateX(-50%) scale(0.9, 1.15) rotate(-1deg); }
            100% { transform: translateX(-50%) scale(1.05, 0.95) rotate(3deg); }
        }
        .flame.out {
            animation: blowOut 0.4s ease-out forwards !important;
        }
        @keyframes blowOut {
            0% { transform: translateX(-50%) scale(1); opacity: 1; }
            30% { transform: translateX(-50%) scale(1.8, 0.3) translateX(4px); opacity: 0.7; }
            100% { transform: translateX(-50%) scale(0) translateY(-5px); opacity: 0; }
        }

        /* SMOKE */
        .smoke-puff {
            position: absolute; width: 6px; height: 6px;
            background: rgba(180, 180, 190, 0.5); border-radius: 50%;
            left: 50%; top: -2px; transform: translateX(-50%);
            animation: smokeRise 0.8s ease-out forwards; pointer-events: none;
        }
        @keyframes smokeRise {
            0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 0.5; }
            100% { transform: translateX(-50%) translateY(-18px) scale(2.5); opacity: 0; }
        }

        /* --- CAKE TIERS --- */
        .cake-tier {
            position: relative; z-index: 2;
            border-radius: 10px 10px 12px 12px;
            overflow: visible;
            box-shadow: 0 3px 10px rgba(180, 60, 100, 0.15);
        }

        /* Tier 1 — Top (smallest, lightest) */
        .tier-1 {
            width: clamp(110px, 32vw, 160px); height: 36px;
            background: linear-gradient(180deg, #ffd6e0 0%, #ffc8d6 40%, #ffbdcf 100%);
            border-bottom: 2px solid #f4a0b8;
        }

        /* Tier 2 — Middle */
        .tier-2 {
            width: clamp(160px, 46vw, 220px); height: 44px;
            background: linear-gradient(180deg, #ffb7c5 0%, #ffa8b8 40%, #ff91a4 100%);
            border-bottom: 2px solid #ec7d94;
            margin-top: -1px;
        }

        /* Tier 3 — Bottom (largest, deepest) */
        .tier-3 {
            width: clamp(210px, 60vw, 290px); height: 54px;
            background: linear-gradient(180deg, #ff91a4 0%, #ff8298 30%, #ff7b93 100%);
            border-bottom: 3px solid #e86a85;
            margin-top: -1px;
            border-radius: 12px 12px 14px 14px;
        }

        /* Frosting on each tier */
        .frosting {
            position: absolute; top: -1px; left: 0; right: 0; height: 12px;
            overflow: visible; z-index: 1;
        }
        .frosting::before {
            content: ''; position: absolute; top: 0; left: 6%; right: 6%; height: 9px;
            background: #ffe4ec; border-radius: 0 0 50% 50%;
        }
        .drip {
            position: absolute; top: 7px;
            background: #ffe4ec; border-radius: 0 0 50% 50%;
        }

        /* Tier-specific drip patterns */
        .tier-1 .drip:nth-child(1) { left: 15%; width: 7px; height: 10px; }
        .tier-1 .drip:nth-child(2) { left: 45%; width: 8px; height: 13px; }
        .tier-1 .drip:nth-child(3) { left: 75%; width: 7px; height: 9px; }

        .tier-2 .drip:nth-child(1) { left: 10%; width: 8px; height: 12px; }
        .tier-2 .drip:nth-child(2) { left: 28%; width: 9px; height: 15px; }
        .tier-2 .drip:nth-child(3) { left: 50%; width: 7px; height: 10px; }
        .tier-2 .drip:nth-child(4) { left: 70%; width: 10px; height: 14px; }
        .tier-2 .drip:nth-child(5) { left: 88%; width: 8px; height: 11px; }

        .tier-3 .drip:nth-child(1) { left: 8%; width: 9px; height: 14px; }
        .tier-3 .drip:nth-child(2) { left: 22%; width: 10px; height: 17px; }
        .tier-3 .drip:nth-child(3) { left: 38%; width: 8px; height: 11px; }
        .tier-3 .drip:nth-child(4) { left: 54%; width: 11px; height: 16px; }
        .tier-3 .drip:nth-child(5) { left: 70%; width: 9px; height: 13px; }
        .tier-3 .drip:nth-child(6) { left: 86%; width: 10px; height: 15px; }

        /* Decorations on tiers */
        .tier-decor {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; z-index: 1;
        }
        .pearl {
            width: 5px; height: 5px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff, #f0d0dc);
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .pearl.small { width: 4px; height: 4px; }

        /* "21" on bottom tier */
        .cake-number {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(22px, 5vw, 30px);
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 1px 3px rgba(0,0,0,0.12);
            z-index: 2;
        }

        /* Tier highlight (shine) */
        .cake-tier::after {
            content: ''; position: absolute;
            top: 14px; left: 8%; right: 8%; height: 6px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25) 30%, rgba(255,255,255,0.35) 50%, rgba(255,255,255,0.25) 70%, transparent);
            border-radius: 50%; z-index: 1;
        }

        /* Heart decoration on middle tier */
        .cake-heart {
            color: rgba(255,255,255,0.6);
            font-size: 10px;
        }

        /* Cake plate */
        .cake-plate {
            width: clamp(240px, 66vw, 320px); height: 14px;
            background: linear-gradient(180deg, #ede0e5 0%, #ddd0d7 100%);
            border-radius: 50%; margin-top: -1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1; position: relative;
        }
        .cake-plate::after {
            content: ''; position: absolute;
            top: 3px; left: 15%; right: 15%; height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5) 50%, transparent);
            border-radius: 50%;
        }

        /* =============================================
           WISH BUTTON — Eye-catching, impossible to miss
           ============================================= */
        .wish-section {
            display: flex; flex-direction: column;
            align-items: center; gap: 8px;
        }
        .wish-btn {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(20px, 5vw, 26px);
            color: #fff; letter-spacing: 0.5px;
            background: linear-gradient(-45deg, #f06292, #ec407a, #ff80ab, #e91e63, #f48fb1, #ff6b9d);
            background-size: 300% 300%;
            animation: btnGradient 4s ease infinite, btnFloat 3s ease-in-out infinite;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 60px;
            padding: 16px 40px;
            cursor: pointer;
            box-shadow:
                0 0 20px rgba(236, 64, 122, 0.4),
                0 0 50px rgba(236, 64, 122, 0.15),
                0 8px 30px rgba(0, 0, 0, 0.12);
            position: relative; overflow: hidden;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            z-index: 5;
            -webkit-tap-highlight-color: transparent;
        }
        /* Shimmer sweep */
        .wish-btn::before {
            content: ''; position: absolute;
            top: 0; left: -100%; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: shimmer 3s ease-in-out infinite 1s;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }
        /* Sparkle icon */
        .wish-btn .sparkle-left,
        .wish-btn .sparkle-right {
            position: absolute; top: 50%; font-size: 14px;
            color: #ffd54f; pointer-events: none;
        }
        .wish-btn .sparkle-left { left: 12px; transform: translateY(-50%); animation: sparklePop 2.5s ease-in-out infinite; }
        .wish-btn .sparkle-right { right: 12px; transform: translateY(-50%); animation: sparklePop 2.5s ease-in-out infinite 1.2s; }
        @keyframes sparklePop {
            0%, 100% { opacity: 0.3; transform: translateY(-50%) scale(0.7); }
            50% { opacity: 1; transform: translateY(-50%) scale(1.3); }
        }
        @keyframes btnGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes btnFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .wish-btn:active { transform: translateY(0) scale(0.97); }

        /* Listening state */
        .wish-btn.listening {
            animation: btnGradient 4s ease infinite, btnListening 1.5s ease-in-out infinite;
            background-size: 300% 300%;
            border-color: rgba(255, 255, 255, 0.5);
        }
        @keyframes btnListening {
            0%, 100% { box-shadow: 0 0 20px rgba(236, 64, 122, 0.5), 0 0 50px rgba(236, 64, 122, 0.2), 0 0 0 0 rgba(236, 64, 122, 0.4); }
            50% { box-shadow: 0 0 25px rgba(236, 64, 122, 0.6), 0 0 60px rgba(236, 64, 122, 0.3), 0 0 0 10px rgba(236, 64, 122, 0); }
        }
        .wish-btn:disabled {
            opacity: 0.5; cursor: default; transform: none !important;
            animation: btnGradient 4s ease infinite !important;
        }

        .blow-hint {
            font-size: 12px; color: #c97b93; font-weight: 500;
            opacity: 0; transition: opacity 0.3s; text-align: center;
        }
        .blow-hint.show { opacity: 1; }

        .candle-counter {
            font-size: 13px; color: #d6336c;
            font-weight: 600; min-height: 18px;
        }

        /* --- MESSAGE --- */
        .message-section {
            display: none; flex-direction: column;
            align-items: center; gap: 16px;
            max-width: 400px; text-align: center;
        }
        .message-section.show { display: flex; animation: msgFadeIn 1.5s ease-out; }
        @keyframes msgFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(26px, 7vw, 42px); color: #d6336c;
            text-shadow: 0 2px 15px rgba(214, 51, 108, 0.3);
        }
        .message-text {
            font-size: clamp(13px, 3.5vw, 16px);
            color: #6b3a5a; line-height: 1.8; font-weight: 500;
        }
        .message-text .typed-cursor {
            display: inline-block; width: 2px; height: 1em;
            background: #d6336c; margin-left: 2px;
            vertical-align: text-bottom;
            animation: cursorBlink 0.8s step-end infinite;
        }
        @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* --- CONFETTI HINT --- */
        .confetti-hint {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            font-size: 11px; color: rgba(156, 68, 102, 0.4); font-weight: 500;
            z-index: 50; pointer-events: none;
            animation: hintFade 4s ease-in-out infinite;
        }
        @keyframes hintFade { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }

        /* --- RESPONSIVE --- */
        @media (max-width: 380px) {
            .tier-candles-bot .candles-row { gap: 3px; }
            .tier-candles-bot .candle-body { width: 4px; height: 14px; }
            .tier-candles-bot .flame { width: 5px; height: 9px; }
            .tier-candles-mid .candles-row { gap: 5px; }
            .countdown-box { min-width: 56px; padding: 8px 8px; }
            .wish-btn { padding: 14px 30px; }
        }
        @media (min-height: 800px) { .content { gap: 24px; } }
        @supports (padding-top: env(safe-area-inset-top)) {
            .content { padding-top: calc(24px + env(safe-area-inset-top)); }
        }
    </style>
</head>
<body>

    <!-- Background glow blobs -->
    <div class="glow-blob"></div>
    <div class="glow-blob"></div>
    <div class="glow-blob"></div>

    <!-- Sakura petal canvas -->
    <canvas id="sakura-canvas"></canvas>

    <!-- Edge glow visualizer -->
    <div id="edge-glow">
        <div id="edge-glow-inner"></div>
        <div id="edge-glow-fill"></div>
    </div>

    <!-- Effects canvas -->
    <canvas id="effects-canvas"></canvas>

    <!-- Main Content -->
    <div class="content">
        <h1 class="name">Helia</h1>
        <p class="subtitle">Turning 21 on August 15, 2026</p>

        <!-- Countdown -->
        <div class="countdown" id="countdown">
            <div class="countdown-box">
                <div class="countdown-number" id="cd-days">--</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-number" id="cd-hours">--</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-number" id="cd-mins">--</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-number" id="cd-secs">--</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>

        <!-- Birthday banner -->
        <div class="birthday-banner" id="birthday-banner">🎂 It's your birthday! 🎂</div>

        <!-- Cake Section -->
        <div class="cake-section" id="cake-section">
            <div class="cake-wrapper">

                <!-- TOP TIER CANDLES (4) -->
                <div class="tier-candles-top" id="candles-top"></div>

                <!-- TOP TIER -->
                <div class="cake-tier tier-1">
                    <div class="frosting">
                        <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                    </div>
                    <div class="tier-decor">
                        <div class="pearl small"></div>
                        <div class="pearl small"></div>
                        <div class="pearl small"></div>
                    </div>
                </div>

                <!-- MIDDLE TIER CANDLES (7) -->
                <div class="tier-candles-mid" id="candles-mid"></div>

                <!-- MIDDLE TIER -->
                <div class="cake-tier tier-2">
                    <div class="frosting">
                        <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                        <div class="drip"></div><div class="drip"></div>
                    </div>
                    <div class="tier-decor">
                        <div class="cake-heart">♥</div>
                        <div class="pearl"></div>
                        <div class="cake-heart">♥</div>
                        <div class="pearl"></div>
                        <div class="cake-heart">♥</div>
                    </div>
                </div>

                <!-- BOTTOM TIER CANDLES (10) -->
                <div class="tier-candles-bot" id="candles-bot"></div>

                <!-- BOTTOM TIER -->
                <div class="cake-tier tier-3">
                    <div class="frosting">
                        <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                        <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                    </div>
                    <div class="tier-decor">
                        <div class="pearl"></div><div class="pearl"></div>
                        <div class="pearl"></div><div class="pearl"></div>
                        <div class="pearl"></div>
                    </div>
                    <div class="cake-number">21</div>
                </div>

                <!-- PLATE -->
                <div class="cake-plate"></div>
            </div>

            <div class="candle-counter" id="candle-counter"></div>

            <div class="wish-section">
                <button class="wish-btn" id="wish-btn">
                    <span class="sparkle-left">✦</span>
                    Make a wish and press me
                    <span class="sparkle-right">✦</span>
                </button>
                <p class="blow-hint" id="blow-hint">Blow into your mic — fill the glow to put out a candle!</p>
            </div>
        </div>

        <!-- Message -->
        <div class="message-section" id="message-section">
            <h2 class="message-title">Happy 21st Birthday, Helia! 🌸</h2>
            <p class="message-text" id="message-text"></p>
        </div>
    </div>

    <div class="confetti-hint" id="confetti-hint">tap anywhere for confetti ✨</div>

    <script>
    (function() {
        // =============================================
        //  CUSTOMIZE THESE!
        // =============================================
        const BIRTHDAY_NAME = 'Helia';
        const BIRTHDAY_DATE = new Date('2026-08-15T00:00:00');
        const AGE = 21;
        const CANDLE_COUNT = 21;

        // Candle distribution per tier (must sum to CANDLE_COUNT)
        const TIER_CANDLES = [4, 7, 10]; // top, middle, bottom

        // EDIT: Your birthday message below
        const BIRTHDAY_MESSAGE =
            'Happy 21st Birthday, ' + BIRTHDAY_NAME + '! \ud83c\udf38 ' +
            'Wishing you a day filled with love, laughter, and all the things that make you smile. ' +
            'Here\'s to 21 years of being absolutely amazing, and to many, many more beautiful years ahead. ' +
            'You deserve the world and more. Love you! \ud83d\udc95';

        // Blow detection settings
        const MIN_BLOW_THRESHOLD = 0.12;  // Minimum blow level to start charging
        const CHARGE_RATE = 0.018;         // How fast glow fills per frame (~1s sustained blow)
        const CHARGE_DECAY = 0.012;        // How fast glow fades per frame
        const BLOW_LOW_FREQ_BINS = 23;     // Low-freq bins for blow detection

        // =============================================
        //  STATE
        // =============================================
        let candlesOut = 0;
        let isListening = false;
        let audioCtx = null;
        let analyser = null;
        let micStream = null;
        let celebrationDone = false;
        let chargeLevel = 0;

        // =============================================
        //  DOM REFS
        // =============================================
        const edgeGlow = document.getElementById('edge-glow');
        const edgeGlowInner = document.getElementById('edge-glow-inner');
        const edgeGlowFill = document.getElementById('edge-glow-fill');
        const wishBtn = document.getElementById('wish-btn');
        const blowHint = document.getElementById('blow-hint');
        const candleCounter = document.getElementById('candle-counter');

        // =============================================
        //  COUNTDOWN
        // =============================================
        const cdDays = document.getElementById('cd-days');
        const cdHours = document.getElementById('cd-hours');
        const cdMins = document.getElementById('cd-mins');
        const cdSecs = document.getElementById('cd-secs');
        const countdownEl = document.getElementById('countdown');
        const bannerEl = document.getElementById('birthday-banner');

        function updateCountdown() {
            const now = new Date();
            const diff = BIRTHDAY_DATE - now;
            if (diff <= 0) {
                countdownEl.style.display = 'none';
                bannerEl.classList.add('show');
                return;
            }
            cdDays.textContent = String(Math.floor(diff / 86400000)).padStart(2, '0');
            cdHours.textContent = String(Math.floor((diff / 3600000) % 24)).padStart(2, '0');
            cdMins.textContent = String(Math.floor((diff / 60000) % 60)).padStart(2, '0');
            cdSecs.textContent = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // =============================================
        //  GENERATE CANDLES PER TIER
        // =============================================
        const tierContainers = [
            document.getElementById('candles-top'),
            document.getElementById('candles-mid'),
            document.getElementById('candles-bot')
        ];

        function createCandleRow(container, count) {
            const row = document.createElement('div');
            row.className = 'candles-row';
            for (let i = 0; i < count; i++) {
                const candle = document.createElement('div');
                candle.className = 'candle';
                candle.innerHTML =
                    '<div class="flame-container">' +
                        '<div class="flame" style="--fs: ' + Math.random() + '"></div>' +
                    '</div>' +
                    '<div class="wick"></div>' +
                    '<div class="candle-body"></div>';
                row.appendChild(candle);
            }
            container.appendChild(row);
        }

        TIER_CANDLES.forEach(function(count, i) {
            createCandleRow(tierContainers[i], count);
        });

        // Collect all flames in extinguishing order (top tier first)
        const allFlames = Array.from(document.querySelectorAll('.flame'));
        const totalCandles = allFlames.length;

        function updateCounter() {
            if (candlesOut > 0 && candlesOut < totalCandles) {
                candleCounter.textContent = candlesOut + ' / ' + totalCandles + ' candles out';
            } else {
                candleCounter.textContent = '';
            }
        }

        function extinguishCandle() {
            if (candlesOut >= totalCandles) return;
            const flame = allFlames[candlesOut];
            if (!flame || flame.classList.contains('out')) return;

            flame.classList.add('out');

            // Smoke puff
            var container = flame.parentElement;
            var smoke = document.createElement('div');
            smoke.className = 'smoke-puff';
            container.appendChild(smoke);
            setTimeout(function() { smoke.remove(); }, 800);

            candlesOut++;
            updateCounter();

            if (candlesOut >= totalCandles) {
                onAllCandlesOut();
            }
        }

        // =============================================
        //  EDGE GLOW VISUALIZER
        // =============================================
        function updateEdgeGlow(charge) {
            if (charge < 0.01) {
                edgeGlow.classList.remove('active');
                edgeGlowFill.style.boxShadow = 'none';
                return;
            }

            edgeGlow.classList.add('active');

            // Conic gradient ring showing progress around the edges
            var angle = charge * 360;
            var intensity = Math.min(charge * 1.5, 1);

            // Color shifts: soft pink → hot pink → intense magenta
            var r = Math.round(236 + (255 - 236) * charge);
            var g = Math.round(64 + (100 - 64) * charge);
            var b = Math.round(122 + (180 - 122) * charge);
            var mainColor = 'rgba(' + r + ',' + g + ',' + b + ',' + (0.8 * intensity) + ')';
            var lightColor = 'rgba(255,128,171,' + (0.5 * intensity) + ')';

            edgeGlowInner.style.background =
                'conic-gradient(from -90deg, ' + mainColor + ' 0deg, ' +
                lightColor + ' ' + (angle * 0.5) + 'deg, ' +
                mainColor + ' ' + angle + 'deg, ' +
                'transparent ' + angle + 'deg, transparent 360deg)';

            // Inward fill glow (box-shadow grows from edges toward center)
            var spread = charge * 70;
            var blur = charge * 35;
            var fillOpacity = charge * 0.35;

            // Pulse when close to full (>70%)
            var pulse = charge > 0.7 ? (0.05 * Math.sin(Date.now() * 0.01)) : 0;
            fillOpacity = Math.min(1, fillOpacity + pulse);

            edgeGlowFill.style.boxShadow =
                'inset 0 0 ' + blur + 'px ' + spread + 'px rgba(' + r + ',' + g + ',' + b + ',' + fillOpacity + '),' +
                'inset 0 0 ' + (blur * 1.5) + 'px ' + (spread * 1.5) + 'px rgba(' + r + ',' + g + ',' + b + ',' + (fillOpacity * 0.4) + ')';
        }

        function flashEdgeGlow() {
            edgeGlowFill.style.transition = 'none';
            edgeGlowFill.style.boxShadow = 'inset 0 0 100px 50px rgba(255,255,255,0.6)';
            edgeGlow.classList.add('active');

            setTimeout(function() {
                edgeGlowFill.style.transition = 'box-shadow 0.4s ease';
                edgeGlowFill.style.boxShadow = 'none';
                edgeGlow.classList.remove('active');
            }, 150);
        }

        // =============================================
        //  BLOW DETECTION WITH CHARGE MECHANIC
        // =============================================
        wishBtn.addEventListener('click', startListening);

        async function startListening() {
            if (isListening) {
                stopListening();
                return;
            }

            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var source = audioCtx.createMediaStreamSource(micStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.75;
                source.connect(analyser);

                isListening = true;
                chargeLevel = 0;
                wishBtn.classList.add('listening');
                wishBtn.innerHTML =
                    '<span class="sparkle-left">✦</span>' +
                    '🎤 Listening...' +
                    '<span class="sparkle-right">✦</span>';
                blowHint.classList.add('show');

                detectBlow();
            } catch (err) {
                console.log('Mic denied:', err);
                wishBtn.innerHTML =
                    '<span class="sparkle-left">✦</span>' +
                    'Tap to blow out!' +
                    '<span class="sparkle-right">✦</span>';
                wishBtn.onclick = function() {
                    extinguishCandle();
                    flashEdgeGlow();
                    if (navigator.vibrate) navigator.vibrate(30);
                };
            }
        }

        function stopListening() {
            isListening = false;
            wishBtn.classList.remove('listening');
            wishBtn.innerHTML =
                '<span class="sparkle-left">✦</span>' +
                'Make a wish and press me' +
                '<span class="sparkle-right">✦</span>';
            blowHint.classList.remove('show');
            chargeLevel = 0;
            updateEdgeGlow(0);

            if (micStream) { micStream.getTracks().forEach(function(t) { t.stop(); }); micStream = null; }
            if (audioCtx) { audioCtx.close(); audioCtx = null; analyser = null; }
        }

        function detectBlow() {
            if (!isListening || !analyser) return;

            var bufferLength = analyser.frequencyBinCount;
            var dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // Low-frequency energy (blowing)
            var lowEnergy = 0;
            var totalEnergy = 0;
            for (var i = 0; i < bufferLength; i++) {
                var val = dataArray[i];
                totalEnergy += val;
                if (i < BLOW_LOW_FREQ_BINS) lowEnergy += val;
            }

            var lowRatio = lowEnergy / Math.max(totalEnergy, 1);
            var normalizedLow = lowEnergy / (BLOW_LOW_FREQ_BINS * 255);

            // Charge up if blowing hard enough
            if (normalizedLow > MIN_BLOW_THRESHOLD && lowRatio > 0.25) {
                chargeLevel = Math.min(1, chargeLevel + CHARGE_RATE);
            } else {
                chargeLevel = Math.max(0, chargeLevel - CHARGE_DECAY);
            }

            // Update visual
            updateEdgeGlow(chargeLevel);

            // Update hint text based on charge
            if (chargeLevel > 0.7) {
                blowHint.textContent = 'Almost there! Keep blowing! 💨';
            } else if (chargeLevel > 0.3) {
                blowHint.textContent = 'Keep going... fill the glow! ✨';
            } else {
                blowHint.textContent = 'Blow into your mic — fill the glow to put out a candle!';
            }

            // Candle out when fully charged
            if (chargeLevel >= 1.0) {
                extinguishCandle();
                flashEdgeGlow();
                chargeLevel = 0;
                if (navigator.vibrate) navigator.vibrate(50);
            }

            requestAnimationFrame(detectBlow);
        }

        // =============================================
        //  CELEBRATION
        // =============================================
        function onAllCandlesOut() {
            if (celebrationDone) return;
            celebrationDone = true;

            stopListening();
            wishBtn.disabled = true;
            wishBtn.innerHTML =
                '<span class="sparkle-left">✦</span>' +
                '✨ Your wish will come true ✨' +
                '<span class="sparkle-right">✦</span>';
            blowHint.classList.remove('show');

            launchFireworks();
            setTimeout(launchFireworks, 1200);
            setTimeout(launchFireworks, 2800);
            setTimeout(launchFireworks, 4200);

            setTimeout(function() {
                document.getElementById('cake-section').style.display = 'none';
                var msgSection = document.getElementById('message-section');
                msgSection.classList.add('show');
                typeMessage(BIRTHDAY_MESSAGE);
            }, 3000);
        }

        // =============================================
        //  TYPEWRITER MESSAGE
        // =============================================
        function typeMessage(text) {
            var el = document.getElementById('message-text');
            var i = 0;
            var cursor = '<span class="typed-cursor"></span>';
            function type() {
                if (i < text.length) {
                    el.innerHTML = text.substring(0, i + 1) + cursor;
                    i++;
                    setTimeout(type, Math.random() * 40 + 30);
                } else {
                    setTimeout(function() { el.innerHTML = text; }, 2000);
                }
            }
            type();
        }

        // =============================================
        //  SAKURA PETAL SYSTEM
        // =============================================
        var sakuraCanvas = document.getElementById('sakura-canvas');
        var sCtx = sakuraCanvas.getContext('2d');
        var sWidth, sHeight;
        var petals = [];
        var PETAL_COLORS = ['#ffb7c5', '#ffc1cc', '#f8bbd0', '#ffd1dc', '#f48fb1', '#fce4ec'];
        var MAX_PETALS = window.innerWidth < 500 ? 28 : 45;

        function resizeSakura() {
            sWidth = window.innerWidth; sHeight = window.innerHeight;
            sakuraCanvas.width = sWidth; sakuraCanvas.height = sHeight;
        }

        function Petal() { this.reset(true); }
        Petal.prototype.reset = function(initial) {
            this.x = Math.random() * sWidth;
            this.y = initial ? Math.random() * sHeight : -20;
            this.size = Math.random() * 8 + 5;
            this.speedY = Math.random() * 1.2 + 0.4;
            this.speedX = Math.random() * 0.6 - 0.3;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.03;
            this.wobbleSpeed = Math.random() * 0.02 + 0.01;
            this.wobbleOffset = Math.random() * Math.PI * 2;
            this.opacity = Math.random() * 0.4 + 0.4;
            this.color = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
            this.type = Math.random() > 0.7 ? 'flower' : 'petal';
        };
        Petal.prototype.update = function(t) {
            this.y += this.speedY;
            this.x += this.speedX + Math.sin(t * this.wobbleSpeed + this.wobbleOffset) * 0.5;
            this.rotation += this.rotSpeed;
            if (this.y > sHeight + 20) this.reset(false);
            if (this.x < -20) this.x = sWidth + 20;
            if (this.x > sWidth + 20) this.x = -20;
        };
        Petal.prototype.draw = function(ctx) {
            ctx.save();
            ctx.globalAlpha = this.opacity;
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.color;
            if (this.type === 'flower') {
                var s = this.size * 0.6;
                for (var i = 0; i < 5; i++) {
                    ctx.save(); ctx.rotate(i * 1.2566);
                    ctx.beginPath(); ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(s * 0.35, -s * 0.3, 0, -s * 0.6);
                    ctx.quadraticCurveTo(-s * 0.35, -s * 0.3, 0, 0);
                    ctx.fill(); ctx.restore();
                }
                ctx.fillStyle = '#fff'; ctx.globalAlpha = this.opacity * 0.8;
                ctx.beginPath(); ctx.arc(0, 0, s * 0.1, 0, 6.2832); ctx.fill();
            } else {
                var s2 = this.size;
                ctx.beginPath(); ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(s2 * 0.5, -s2 * 0.4, s2, 0);
                ctx.quadraticCurveTo(s2 * 0.5, s2 * 0.4, 0, 0);
                ctx.fill();
            }
            ctx.restore();
        };

        resizeSakura();
        for (var p = 0; p < MAX_PETALS; p++) petals.push(new Petal());
        var sakuraTime = 0;
        function animateSakura() {
            sCtx.clearRect(0, 0, sWidth, sHeight);
            sakuraTime++;
            for (var i = 0; i < petals.length; i++) {
                petals[i].update(sakuraTime);
                petals[i].draw(sCtx);
            }
            requestAnimationFrame(animateSakura);
        }
        window.addEventListener('resize', resizeSakura);
        animateSakura();

        // =============================================
        //  EFFECTS CANVAS (Confetti + Fireworks)
        // =============================================
        var fxCanvas = document.getElementById('effects-canvas');
        var fxCtx = fxCanvas.getContext('2d');
        var fxWidth, fxHeight;
        function resizeFx() {
            fxWidth = window.innerWidth; fxHeight = window.innerHeight;
            fxCanvas.width = fxWidth; fxCanvas.height = fxHeight;
        }
        window.addEventListener('resize', resizeFx);
        resizeFx();

        var confettiPieces = [];
        var CONFETTI_COLORS = ['#f06292', '#ec407a', '#ff80ab', '#ffb7c5', '#ffd54f', '#fff176', '#f8bbd0', '#ce93d8'];

        function ConfettiPiece(x, y) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 12;
            this.vy = (Math.random() - 1) * 10 - 3;
            this.w = Math.random() * 8 + 4;
            this.h = Math.random() * 4 + 2;
            this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
            this.rot = Math.random() * 6.28;
            this.rotSpd = (Math.random() - 0.5) * 0.3;
            this.gravity = 0.15;
            this.opacity = 1;
            this.decay = Math.random() * 0.005 + 0.008;
        }
        ConfettiPiece.prototype.update = function() {
            this.vy += this.gravity; this.x += this.vx; this.y += this.vy;
            this.vx *= 0.99; this.rot += this.rotSpd; this.opacity -= this.decay;
        };
        ConfettiPiece.prototype.draw = function(ctx) {
            if (this.opacity <= 0) return;
            ctx.save(); ctx.globalAlpha = this.opacity;
            ctx.translate(this.x, this.y); ctx.rotate(this.rot);
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
            ctx.restore();
        };

        function spawnConfetti(x, y, count) {
            for (var i = 0; i < (count || 18); i++) confettiPieces.push(new ConfettiPiece(x, y));
        }

        var fireworkParticles = [];
        var FW_COLORS = ['#f06292', '#ff80ab', '#ffd54f', '#fff176', '#ce93d8', '#f48fb1', '#ffb7c5', '#ff8a80'];

        function FWParticle(x, y, color) {
            this.x = x; this.y = y;
            var angle = Math.random() * 6.28;
            var speed = Math.random() * 5 + 2;
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
            this.color = color; this.opacity = 1;
            this.decay = Math.random() * 0.015 + 0.01;
            this.size = Math.random() * 2.5 + 1;
        }
        FWParticle.prototype.update = function() {
            this.vy += 0.04; this.x += this.vx; this.y += this.vy;
            this.vx *= 0.98; this.vy *= 0.98; this.opacity -= this.decay;
        };
        FWParticle.prototype.draw = function(ctx) {
            if (this.opacity <= 0) return;
            ctx.save(); ctx.globalAlpha = this.opacity;
            ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, 6.28); ctx.fill();
            ctx.restore();
        };

        function launchFireworks() {
            var count = 4 + Math.floor(Math.random() * 3);
            for (var b = 0; b < count; b++) {
                (function(delay) {
                    setTimeout(function() {
                        var cx = Math.random() * fxWidth * 0.6 + fxWidth * 0.2;
                        var cy = Math.random() * fxHeight * 0.4 + fxHeight * 0.1;
                        var color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
                        for (var i = 0; i < 30 + Math.floor(Math.random() * 20); i++) {
                            fireworkParticles.push(new FWParticle(cx, cy, color));
                        }
                    }, delay);
                })(b * 300);
            }
        }

        function animateEffects() {
            fxCtx.clearRect(0, 0, fxWidth, fxHeight);
            var i;
            for (i = confettiPieces.length - 1; i >= 0; i--) {
                confettiPieces[i].update(); confettiPieces[i].draw(fxCtx);
                if (confettiPieces[i].opacity <= 0) confettiPieces.splice(i, 1);
            }
            for (i = fireworkParticles.length - 1; i >= 0; i--) {
                fireworkParticles[i].update(); fireworkParticles[i].draw(fxCtx);
                if (fireworkParticles[i].opacity <= 0) fireworkParticles.splice(i, 1);
            }
            requestAnimationFrame(animateEffects);
        }
        animateEffects();

        // Tap for confetti
        document.addEventListener('click', function(e) {
            if (e.target.closest('button')) return;
            spawnConfetti(e.clientX, e.clientY, 15);
        });
        document.addEventListener('touchstart', function(e) {
            if (e.target.closest('button')) return;
            var t = e.touches[0];
            if (t) spawnConfetti(t.clientX, t.clientY, 15);
        }, { passive: true });

        // Hide hint
        setTimeout(function() {
            var hint = document.getElementById('confetti-hint');
            if (hint) { hint.style.opacity = '0'; setTimeout(function() { if (hint) hint.remove(); }, 1000); }
        }, 8000);

    })();
    </script>
</body>
