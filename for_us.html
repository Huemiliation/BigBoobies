        // =============================================
        //  TYPEWRITER MESSAGE
        //  Handles HTML tags safely (so <span class="name-highlight"> isn't split mid-tag).
        // =============================================
        function typeMessage(text, onDone) {
            var el = document.getElementById('message-text');
            var cursor = '<span class="typed-cursor"></span>';
            // Tokenise: tags are emitted whole, plain chars one-by-one
            var tokens = [];
            var tagBuffer = '';
            var inTag = false;
            for (var k = 0; k < text.length; k++) {
                var ch = text[k];
                if (ch === '<') { inTag = true; tagBuffer = ch; }
                else if (ch === '>') { tagBuffer += ch; tokens.push({tag: true, text: tagBuffer}); inTag = false; tagBuffer = ''; }
                else if (inTag) { tagBuffer += ch; }
                else { tokens.push({tag: false, text: ch}); }
            }
            var i = 0;
            var waveSplitDone = false; // once true, we rebuild carefully to preserve split

            function buildHtml() {
                var s = '';
                for (var j = 0; j < i; j++) s += tokens[j].text;
                return s;
            }

            function type() {
                if (i < tokens.length) {
                    // Once wave is split, always use the split-preserving builder
                    el.innerHTML = (waveSplitDone ? buildHtmlWithSplit(tokens, i) : buildHtml()) + cursor;
                    // After the wave-text's OWN closing </span> is emitted, start using
                    // the split builder so the wave animation begins immediately.
                    if (!waveSplitDone) {
                        // Check if the wave-text opening tag has been emitted
                        var waveStarted = false;
                        var depth = 0;
                        for (var ti = 0; ti < i; ti++) {
                            var tt = tokens[ti];
                            if (tt.tag) {
                                if (tt.text.indexOf('class="wave-text"') !== -1) {
                                    waveStarted = true;
                                    depth = 1; // we're inside wave-text
                                } else if (tt.text.indexOf('<span') === 0 && tt.text.indexOf('class="') !== -1) {
                                    if (waveStarted) depth++; // nested span opens
                                } else if (tt.text === '</span>') {
                                    if (waveStarted) {
                                        depth--;
                                        if (depth === 0) {
                                            // wave-text's own closing tag has been emitted
                                            waveSplitDone = true;
                                            break;
                                        }
                                    }
                                }
                            }
                        }
                        if (waveSplitDone) {
                            // Re-render with the split version preserved
                            el.innerHTML = buildHtmlWithSplit(tokens, i) + cursor;
                        }
                    }
                    // Move dancers upward as the text box grows (mobile)
                    positionDancersAboveMessage();
                    i++;
                    // Skip ahead instantly through tags so there's no pause on them
                    if (i < tokens.length && tokens[i - 1].tag) {
                        type();
                    } else {
                        setTimeout(type, Math.random() * 40 + 30);
                    }
                } else {
                    setTimeout(function() {
                        el.innerHTML = text;
                        // Final activation of wave text
                        activateWaveText();
                        // Final dancer position update
                        positionDancersAboveMessage();
                        if (typeof onDone === 'function') onDone();
                    }, 1800);
                }
            }

            // Build HTML but preserve the already-split wave-text spans.
            // Handles nested .wave-small wrapper so "Kuchulu" stays small.
            function buildHtmlWithSplit(toks, upTo) {
                var result = '';
                var inWave = false;
                var inSmall = false;
                var waveDelay = 0;
                var normalLetters = '';
                var smallLetters = '';

                function emitLetters(letters, target) {
                    for (var li = 0; li < letters.length; li++) {
                        var lc = letters[li];
                        target += '<span class="wave-letter" style="animation-delay:' + (waveDelay * 0.1) + 's">' +
                                  (lc === ' ' ? '&nbsp;' : lc) + '</span>';
                        waveDelay++;
                    }
                    return target;
                }

                for (var j = 0; j < upTo; j++) {
                    var tk = toks[j];
                    if (tk.tag && tk.text.indexOf('class="wave-text"') !== -1) {
                        inWave = true;
                        result += tk.text; // opening <span class="wave-text">
                    } else if (inWave && tk.tag && tk.text.indexOf('class="wave-small"') !== -1) {
                        inSmall = true;
                        // Emit any normal letters collected so far
                        result = emitLetters(normalLetters, result);
                        normalLetters = '';
                        result += tk.text; // opening <span class="wave-small">
                    } else if (inWave && tk.tag && tk.text === '</span>') {
                        if (inSmall) {
                            // Close wave-small: emit small letters inside it
                            result = emitLetters(smallLetters, result);
                            smallLetters = '';
                            result += tk.text; // closing </span> for wave-small
                            inSmall = false;
                        } else {
                            // Close wave-text: emit any remaining normal letters
                            result = emitLetters(normalLetters, result);
                            normalLetters = '';
                            result += tk.text; // closing </span> for wave-text
                            inWave = false;
                        }
                    } else if (inWave && !tk.tag) {
                        if (inSmall) smallLetters += tk.text;
                        else normalLetters += tk.text;
                    } else {
                        result += tk.text;
                    }
                }
                // If we're still inside wave (not yet closed), emit collected letters
                if (inWave) {
                    if (inSmall) {
                        result = emitLetters(smallLetters, result);
                    } else {
                        result = emitLetters(normalLetters, result);
                    }
                }
                return result;
            }

            type();
        }

        // Type the signature line (simpler — no nested HTML)

        // After the message finishes, split the wave-text "Hulu Kuchulu" into
        // per-letter spans so the wave CSS animation can ripple through them.
        // Preserves nested .wave-small wrapper so "Kuchulu" stays small.
        // Safe to call multiple times — checks dataset.split to avoid re-splitting.
        function activateWaveText() {
            var waveEl = document.querySelector('.message-text .wave-text');
            if (!waveEl || waveEl.dataset.split === '1') return;
            var delay = 0;
            function splitNode(node) {
                if (node.nodeType === 3) { // text node
                    var text = node.textContent;
                    var frag = document.createDocumentFragment();
                    for (var i = 0; i < text.length; i++) {
                        var sp = document.createElement('span');
                        sp.className = 'wave-letter';
                        sp.textContent = text[i] === ' ' ? '\u00A0' : text[i];
                        sp.style.animationDelay = (delay * 0.1) + 's';
                        delay++;
                        frag.appendChild(sp);
                    }
                    node.parentNode.replaceChild(frag, node);
                } else if (node.nodeType === 1) { // element
                    var children = Array.prototype.slice.call(node.childNodes);
                    for (var c = 0; c < children.length; c++) {
                        splitNode(children[c]);
                    }
                }
            }
            splitNode(waveEl);
            waveEl.dataset.split = '1';
        }

        // =============================================
        //  SAKURA PETAL SYSTEM
        //  Colors expand (magenta, rose, wine red, pink) and count
        //  grows as more candles are blown out.
        // =============================================
        var sakuraCanvas = document.getElementById('sakura-canvas');
        var sCtx = sakuraCanvas.getContext('2d');
        var sWidth, sHeight;
        var petals = [];

        // Petal palette tiers — unlocked gradually as progress increases.
        // Tier 0 (start): soft pinks
        var PETAL_COLORS_TIER0 = ['#ffb7c5', '#ffc1cc', '#f8bbd0', '#ffd1dc', '#fce4ec'];
        // Tier 1 (~25%): add brighter pinks + rose
        var PETAL_COLORS_TIER1 = ['#ffb7c5', '#ffc1cc', '#f8bbd0', '#ffd1dc', '#fce4ec', '#ff6b9d', '#ff4081'];
        // Tier 2 (~50%): add magenta + wine red
        var PETAL_COLORS_TIER2 = ['#ffb7c5', '#ffc1cc', '#f8bbd0', '#ffd1dc', '#fce4ec', '#ff6b9d', '#ff4081', '#e91e63', '#ad1457', '#880e4f'];
        // Tier 3 (~75%+): full rich palette (deep wine + magenta dominant)
        var PETAL_COLORS_TIER3 = ['#ff6b9d', '#ff4081', '#e91e63', '#c2185b', '#ad1457', '#880e4f', '#ec407a', '#d81b60', '#ff80ab', '#f48fb1'];

        // Base vs max petal counts (scaled by viewport)
        var BASE_PETALS = window.innerWidth < 500 ? 22 : 36;
        var MAX_PETALS_CAP = window.innerWidth < 500 ? 80 : 130;

        function getActivePetalColors() {
            var progress = candlesOut / totalCandles;
            if (progress >= 0.75) return PETAL_COLORS_TIER3;
            if (progress >= 0.5)  return PETAL_COLORS_TIER2;
            if (progress >= 0.25) return PETAL_COLORS_TIER1;
            return PETAL_COLORS_TIER0;
        }

        // Petal count scales smoothly from 0 (no candles out) up to MAX_PETALS_CAP (all out).
        // Before any candle is blown, target is 0 — petals only begin after the first blow.
        function getTargetPetalCount() {
            var progress = candlesOut / totalCandles;
            if (progress <= 0) return 0;
            return Math.round(MAX_PETALS_CAP * progress);
        }

        function resizeSakura() {
            sWidth = window.innerWidth; sHeight = window.innerHeight;
            sakuraCanvas.width = sWidth; sakuraCanvas.height = sHeight;
        }

        function Petal(initial) { this.reset(initial); }
        Petal.prototype.reset = function(initial) {
            this.x = Math.random() * sWidth;
            this.y = initial ? Math.random() * sHeight : -20;
            this.size = Math.random() * 8 + 5;
            this.speedY = Math.random() * 1.4 + 0.8;    // faster fall so petals appear sooner
            this.speedX = Math.random() * 0.5 - 0.25;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.03;
            this.wobbleSpeed = Math.random() * 0.02 + 0.01;
            this.wobbleOffset = Math.random() * Math.PI * 2;
            this.targetOpacity = Math.random() * 0.4 + 0.4;
            this.opacity = 0;                             // start invisible — fade in smoothly
            this.fadeInSpeed = 0.012 + Math.random() * 0.01; // faster fade-in
            this.color = getActivePetalColors()[Math.floor(Math.random() * getActivePetalColors().length)];
            this.type = Math.random() > 0.7 ? 'flower' : 'petal';
        };
        Petal.prototype.update = function(t) {
            this.y += this.speedY;
            this.x += this.speedX + Math.sin(t * this.wobbleSpeed + this.wobbleOffset) * 0.5;
            this.rotation += this.rotSpeed;
            // Smooth fade-in toward target opacity
            if (this.opacity < this.targetOpacity) {
                this.opacity += this.fadeInSpeed;
                if (this.opacity > this.targetOpacity) this.opacity = this.targetOpacity;
            }
            if (this.y > sHeight + 20) this.reset(false);
            if (this.x < -20) this.x = sWidth + 20;
            if (this.x > sWidth + 20) this.x = -20;
        };
        Petal.prototype.draw = function(ctx) {
            ctx.save();
            ctx.globalAlpha = this.opacity;
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.color;
            if (this.type === 'flower') {
                var s = this.size * 0.6;
                for (var i = 0; i < 5; i++) {
                    ctx.save(); ctx.rotate(i * 1.2566);
                    ctx.beginPath(); ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(s * 0.35, -s * 0.3, 0, -s * 0.6);
                    ctx.quadraticCurveTo(-s * 0.35, -s * 0.3, 0, 0);
                    ctx.fill(); ctx.restore();
                }
                ctx.fillStyle = '#fff'; ctx.globalAlpha = this.opacity * 0.8;
                ctx.beginPath(); ctx.arc(0, 0, s * 0.1, 0, 6.2832); ctx.fill();
            } else {
                var s2 = this.size;
                ctx.beginPath(); ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(s2 * 0.5, -s2 * 0.4, s2, 0);
                ctx.quadraticCurveTo(s2 * 0.5, s2 * 0.4, 0, 0);
                ctx.fill();
            }
            ctx.restore();
        };

        resizeSakura();
        // Petals do NOT spawn on load — they only appear (with a smooth fade-in)
        // after the FIRST candle is blown out, then gradually increase in count
        // as more candles are blown.

        var petalSpawnTimer = null;
        var sakuraRunning = false;
        var sakuraTime = 0;

        // Gradually spawn petals toward the current target count (driven by progress).
        // Each new petal starts at opacity 0 and fades in smoothly while falling from the top.
        function startPetalSpawn() {
            if (petalSpawnTimer) clearInterval(petalSpawnTimer);
            petalSpawnTimer = setInterval(function() {
                var target = getTargetPetalCount();
                if (petals.length < target) {
                    petals.push(new Petal(false)); // spawn at top, fall down + fade in
                    if (!sakuraRunning) {
                        sakuraRunning = true;
                        requestAnimationFrame(animateSakura);
                    }
                } else {
                    // Reached the current target — stop the timer, but it will be
                    // restarted by updateProgressEffects() if the target grows.
                    clearInterval(petalSpawnTimer);
                    petalSpawnTimer = null;
                }
            }, 160); // one new petal every 160ms — gradual, never pops in
        }

        function clearAllPetals() {
            petals.length = 0;
            if (petalSpawnTimer) { clearInterval(petalSpawnTimer); petalSpawnTimer = null; }
            sakuraRunning = false;
            sCtx.clearRect(0, 0, sWidth, sHeight);
        }

        // (syncPetalsToProgress is no longer called during candle progress —
        //  petals only exist after the celebration begins.)
        function syncPetalsToProgress() { /* no-op — kept for safety */ }

        function animateSakura() {
            // Optimization: skip the loop entirely when there are no petals
            if (petals.length === 0) {
                sakuraRunning = false;
                return;
            }
            sCtx.clearRect(0, 0, sWidth, sHeight);
            sakuraTime++;
            for (var i = 0; i < petals.length; i++) {
                petals[i].update(sakuraTime);
                petals[i].draw(sCtx);
            }
            requestAnimationFrame(animateSakura);
        }
        window.addEventListener('resize', resizeSakura);

        // =============================================
        //  EFFECTS CANVAS (Confetti + Fireworks)
        // =============================================
        var fxCanvas = document.getElementById('effects-canvas');
        var fxCtx = fxCanvas.getContext('2d');
        var fxWidth, fxHeight;
        function resizeFx() {
            fxWidth = window.innerWidth; fxHeight = window.innerHeight;
            fxCanvas.width = fxWidth; fxCanvas.height = fxHeight;
        }
        window.addEventListener('resize', resizeFx);
        resizeFx();

        var confettiPieces = [];
        var CONFETTI_COLORS = ['#f06292', '#ec407a', '#ff80ab', '#ffb7c5', '#ffd54f', '#fff176', '#f8bbd0', '#ce93d8'];

        function ConfettiPiece(x, y) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 12;
            this.vy = (Math.random() - 1) * 10 - 3;
            this.w = Math.random() * 8 + 4;
            this.h = Math.random() * 4 + 2;
            this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
            this.rot = Math.random() * 6.28;
            this.rotSpd = (Math.random() - 0.5) * 0.3;
            this.gravity = 0.15;
            this.opacity = 1;
            this.decay = Math.random() * 0.005 + 0.008;
        }
        ConfettiPiece.prototype.update = function() {
            this.vy += this.gravity; this.x += this.vx; this.y += this.vy;
            this.vx *= 0.99; this.rot += this.rotSpd; this.opacity -= this.decay;
        };
        ConfettiPiece.prototype.draw = function(ctx) {
            if (this.opacity <= 0) return;
            ctx.save(); ctx.globalAlpha = this.opacity;
            ctx.translate(this.x, this.y); ctx.rotate(this.rot);
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
            ctx.restore();
        };

        function spawnConfetti(x, y, count) {
            for (var i = 0; i < (count || 18); i++) confettiPieces.push(new ConfettiPiece(x, y));
            startFxLoop();
        }

        var fireworkParticles = [];
        var FW_COLORS = ['#f06292', '#ff80ab', '#ffd54f', '#fff176', '#ce93d8', '#f48fb1', '#ffb7c5', '#ff8a80'];

        function FWParticle(x, y, color) {
            this.x = x; this.y = y;
            var angle = Math.random() * 6.28;
            var speed = Math.random() * 5 + 2;
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
            this.color = color; this.opacity = 1;
            this.decay = Math.random() * 0.015 + 0.01;
            this.size = Math.random() * 2.5 + 1;
        }
        FWParticle.prototype.update = function() {
            this.vy += 0.04; this.x += this.vx; this.y += this.vy;
            this.vx *= 0.98; this.vy *= 0.98; this.opacity -= this.decay;
        };
        FWParticle.prototype.draw = function(ctx) {
            if (this.opacity <= 0) return;
            ctx.save(); ctx.globalAlpha = this.opacity;
            ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, 6.28); ctx.fill();
            ctx.restore();
        };

        function launchFireworks() {
            var count = 4 + Math.floor(Math.random() * 3);
            for (var b = 0; b < count; b++) {
                (function(delay) {
                    setTimeout(function() {
                        var cx = Math.random() * fxWidth * 0.6 + fxWidth * 0.2;
                        var cy = Math.random() * fxHeight * 0.4 + fxHeight * 0.1;
                        var color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
                        for (var i = 0; i < 30 + Math.floor(Math.random() * 20); i++) {
                            fireworkParticles.push(new FWParticle(cx, cy, color));
                        }
                        startFxLoop();
                    }, delay);
                })(b * 300);
            }
        }

        var fxRunning = false;
        function animateEffects() {
            // Optimization: skip the loop entirely when there are no particles
            if (confettiPieces.length === 0 && fireworkParticles.length === 0) {
                fxRunning = false;
                return;
            }
            fxCtx.clearRect(0, 0, fxWidth, fxHeight);
            var i;
            for (i = confettiPieces.length - 1; i >= 0; i--) {
                confettiPieces[i].update(); confettiPieces[i].draw(fxCtx);
                if (confettiPieces[i].opacity <= 0) confettiPieces.splice(i, 1);
            }
            for (i = fireworkParticles.length - 1; i >= 0; i--) {
                fireworkParticles[i].update(); fireworkParticles[i].draw(fxCtx);
                if (fireworkParticles[i].opacity <= 0) fireworkParticles.splice(i, 1);
            }
            requestAnimationFrame(animateEffects);
        }
        function startFxLoop() {
            if (!fxRunning) {
                fxRunning = true;
                requestAnimationFrame(animateEffects);
            }
        }

        // Tap for confetti
        document.addEventListener('click', function(e) {
            if (e.target.closest('button')) return;
            spawnConfetti(e.clientX, e.clientY, 15);
        });
        document.addEventListener('touchstart', function(e) {
            if (e.target.closest('button')) return;
            var t = e.touches[0];
            if (t) spawnConfetti(t.clientX, t.clientY, 15);
        }, { passive: true });

        // Hide hint
        setTimeout(function() {
            var hint = document.getElementById('confetti-hint');
            if (hint) { hint.style.opacity = '0'; setTimeout(function() { if (hint) hint.remove(); }, 1000); }
        }, 8000);

        // =============================================
        //  SHOOTING HEARTS BACKGROUND
        //  Shooting-heart-stars that streak across the screen.
        // =============================================
        var bgCanvas = document.getElementById('bg-stars-canvas');
        var bgCtx = bgCanvas.getContext('2d');
        var bgW, bgH;
        function resizeBg() {
            bgW = window.innerWidth; bgH = window.innerHeight;
            bgCanvas.width = bgW; bgCanvas.height = bgH;
        }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        var HEART_STAR_COLORS = [
            'rgba(255, 107, 157, 0.85)',  // pink
            'rgba(233, 30, 99, 0.8)',     // magenta
            'rgba(214, 51, 108, 0.8)',    // rose
            'rgba(255, 183, 197, 0.9)',   // soft pink
            'rgba(173, 20, 87, 0.75)',    // wine
            'rgba(255, 213, 79, 0.8)'     // gold accent
        ];

        // Draw a heart shape at the current context position
        function drawHeart(ctx, size) {
            ctx.beginPath();
            var s = size;
            ctx.moveTo(0, s * 0.25);
            ctx.bezierCurveTo(0, 0, -s, 0, -s, s * 0.3);
            ctx.bezierCurveTo(-s, s * 0.6, -s * 0.5, s * 0.85, 0, s * 1.1);
            ctx.bezierCurveTo(s * 0.5, s * 0.85, s, s * 0.6, s, s * 0.3);
            ctx.bezierCurveTo(s, 0, 0, 0, 0, s * 0.25);
            ctx.fill();
        }

        // Shooting heart-stars — streak across the screen randomly
        function ShootingHeart() { this.reset(); }
        ShootingHeart.prototype.reset = function() {
            // Start from a random edge, fly toward the opposite side
            var side = Math.floor(Math.random() * 4);
            var speed = 4 + Math.random() * 4;
            if (side === 0) { // top-left → bottom-right
                this.x = -30; this.y = Math.random() * bgH * 0.5;
                this.vx = speed; this.vy = speed * 0.5;
            } else if (side === 1) { // top-right → bottom-left
                this.x = bgW + 30; this.y = Math.random() * bgH * 0.5;
                this.vx = -speed; this.vy = speed * 0.5;
            } else if (side === 2) { // left → right, slight down
                this.x = -30; this.y = Math.random() * bgH;
                this.vx = speed; this.vy = (Math.random() - 0.5) * 2;
            } else { // right → left
                this.x = bgW + 30; this.y = Math.random() * bgH;
                this.vx = -speed; this.vy = (Math.random() - 0.5) * 2;
            }
            this.size = Math.random() * 3 + 3;
            this.color = HEART_STAR_COLORS[Math.floor(Math.random() * HEART_STAR_COLORS.length)];
            this.opacity = 0;
            this.fadingIn = true;
            this.life = 0;
            this.maxLife = 120 + Math.random() * 60;
            this.trail = [];
            this.alive = true;
        };
        ShootingHeart.prototype.update = function() {
            this.x += this.vx;
            this.y += this.vy;
            this.life++;
            // Trail
            this.trail.push({x: this.x, y: this.y});
            if (this.trail.length > 12) this.trail.shift();
            // Fade in then out
            if (this.fadingIn) {
                this.opacity += 0.05;
                if (this.opacity >= 0.85) { this.opacity = 0.85; this.fadingIn = false; }
            } else {
                if (this.life > this.maxLife - 30) {
                    this.opacity -= 0.03;
                }
            }
            // Remove when off-screen or life over
            if (this.opacity <= 0 && !this.fadingIn) { this.alive = false; }
            if (this.x < -60 || this.x > bgW + 60 || this.y < -60 || this.y > bgH + 60) { this.alive = false; }
            if (this.life > this.maxLife) { this.alive = false; }
        };
        ShootingHeart.prototype.draw = function(ctx) {
            // Draw trail
            for (var i = 0; i < this.trail.length; i++) {
                var p = this.trail[i];
                var trailAlpha = (i / this.trail.length) * this.opacity * 0.5;
                ctx.save();
                ctx.globalAlpha = Math.max(0, trailAlpha);
                ctx.translate(p.x, p.y);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 4;
                drawHeart(ctx, this.size * (0.3 + i / this.trail.length * 0.7));
                ctx.restore();
            }
            // Draw head
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.opacity);
            ctx.translate(this.x, this.y);
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 10;
            drawHeart(ctx, this.size);
            ctx.restore();
        };

        var shootingHearts = [];



        var bgStarsRunning = false;
        function animateBgStars(t) {
            if (!bgStarsRunning) return;
            bgCtx.clearRect(0, 0, bgW, bgH);
            // Shooting hearts only (floating hearts removed)
            for (var j = shootingHearts.length - 1; j >= 0; j--) {
                shootingHearts[j].update();
                shootingHearts[j].draw(bgCtx);
                if (!shootingHearts[j].alive) shootingHearts.splice(j, 1);
            }
            // Spawn a new shooting heart at random intervals (more frequent)
            if (t > nextShootingHeart) {
                shootingHearts.push(new ShootingHeart());
                nextShootingHeart = t + 800 + Math.random() * 2200; // every 0.8–3s
            }
            // Only keep running if there are active shooting hearts or it's time for the next one
            if (shootingHearts.length > 0 || t <= nextShootingHeart) {
                requestAnimationFrame(animateBgStars);
            } else {
                bgStarsRunning = false;
            }
        }
        // Kick off the shooting heart animation loop
        function ensureBgStarsRunning() {
            if (!bgStarsRunning) {
                bgStarsRunning = true;
                requestAnimationFrame(animateBgStars);
            }
        }
        // Start the loop and spawn the first shooting heart
        nextShootingHeart = 500;
        ensureBgStarsRunning();
        requestAnimationFrame(animateBgStars);

        // =============================================
        //  ENTRANCE: trigger cake section fade-in on load
        // =============================================
        setTimeout(function() {
            cakeSection.classList.add('entered');
        }, 600);

        // Keep dancers positioned above the message on resize (mobile)
        window.addEventListener('resize', function() {
            setTimeout(positionDancersAboveMessage, 50);
        });

    })();
    </script>
</body>
</html>
