<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✶ Happy 21st Birthday, Helia! ✶</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           HELIA'S 21ST BIRTHDAY PAGE
           ============================================
           CUSTOMIZE THESE VARIABLES BELOW:
           - Name, date, message are in the JS section
        */

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%;
            overflow-x: hidden; overflow-y: auto;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(160deg, #fff0f5 0%, #ffe4ec 30%, #ffd6e0 60%, #fff5f7 100%);
            color: #4a1942;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- SAKURA PETAL CANVAS --- */
        #sakura-canvas {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
        }

        /* --- EFFECTS CANVAS (confetti/fireworks) --- */
        #effects-canvas {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 100;
        }

        /* --- GLOW BLOBS --- */
        .glow-blob {
            position: fixed; border-radius: 50%;
            filter: blur(80px); opacity: 0.3;
            pointer-events: none; z-index: 1;
            animation: blobFloat 8s ease-in-out infinite alternate;
        }
        .glow-blob:nth-child(1) {
            width: 300px; height: 300px; background: #ffb7c5;
            top: -50px; left: -50px; animation-delay: 0s;
        }
        .glow-blob:nth-child(2) {
            width: 250px; height: 250px; background: #ffc1cc;
            bottom: -30px; right: -30px; animation-delay: -3s;
        }
        .glow-blob:nth-child(3) {
            width: 200px; height: 200px; background: #f8bbd0;
            top: 40%; left: 60%; animation-delay: -5s;
        }
        @keyframes blobFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.15); }
        }

        /* --- MAIN CONTENT --- */
        .content {
            position: relative; z-index: 10;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 30px 20px;
            gap: 24px;
        }

        /* --- NAME --- */
        .name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(42px, 10vw, 72px);
            color: #d6336c;
            text-shadow: 0 2px 20px rgba(214, 51, 108, 0.3);
            line-height: 1.2;
            animation: nameFadeIn 1.5s ease-out;
        }
        @keyframes nameFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .subtitle {
            font-size: clamp(14px, 3.5vw, 18px);
            color: #9c4466;
            font-weight: 500;
            text-align: center;
            animation: nameFadeIn 1.5s ease-out 0.3s both;
        }

        /* --- COUNTDOWN --- */
        .countdown {
            display: flex; gap: 10px;
            flex-wrap: wrap; justify-content: center;
            animation: nameFadeIn 1.5s ease-out 0.5s both;
        }
        .countdown-box {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 183, 197, 0.5);
            border-radius: 14px;
            padding: 12px 14px;
            min-width: 68px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(214, 51, 108, 0.1);
        }
        .countdown-number {
            font-size: clamp(24px, 6vw, 36px);
            font-weight: 700;
            color: #d6336c;
            line-height: 1.1;
        }
        .countdown-label {
            font-size: 10px;
            font-weight: 600;
            color: #c97b93;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* --- BIRTHDAY BANNER (shown on the day) --- */
        .birthday-banner {
            display: none;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(20px, 5vw, 32px);
            color: #d6336c;
            animation: bannerPulse 2s ease-in-out infinite;
        }
        .birthday-banner.show { display: block; }
        @keyframes bannerPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 20px rgba(214, 51, 108, 0.3); }
            50% { transform: scale(1.05); text-shadow: 0 0 40px rgba(214, 51, 108, 0.6); }
        }

        /* --- CAKE CONTAINER --- */
        .cake-section {
            display: flex; flex-direction: column;
            align-items: center; gap: 16px;
            animation: nameFadeIn 1.5s ease-out 0.7s both;
        }

        .cake-wrapper {
            position: relative;
            padding: 20px 30px 10px;
        }

        /* --- CANDLES --- */
        .candles-row {
            display: flex; justify-content: center;
            gap: 5px; margin-bottom: -4px;
            position: relative; z-index: 2;
        }
        .candles-row.back { margin-bottom: -10px; opacity: 0.85; }

        .candle {
            display: flex; flex-direction: column;
            align-items: center;
            position: relative;
            width: 10px;
        }
        .candle-body {
            width: 6px; height: 20px;
            border-radius: 2px 2px 0 0;
            position: relative;
        }
        .candle-body::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 3px; border-radius: 0 0 2px 2px;
            background: rgba(0,0,0,0.1);
        }

        /* Candle colors */
        .candle:nth-child(6n+1) .candle-body { background: #ffb7c5; }
        .candle:nth-child(6n+2) .candle-body { background: #ffd1dc; }
        .candle:nth-child(6n+3) .candle-body { background: #f8bbd0; }
        .candle:nth-child(6n+4) .candle-body { background: #ffc1cc; }
        .candle:nth-child(6n+5) .candle-body { background: #f48fb1; }
        .candle:nth-child(6n+6) .candle-body { background: #fce4ec; }

        /* WICK */
        .wick {
            width: 2px; height: 4px;
            background: #555;
            border-radius: 1px;
            margin-bottom: -1px;
        }

        /* FLAME */
        .flame-container {
            position: relative;
            width: 12px; height: 16px;
            margin-bottom: -2px;
        }
        .flame {
            position: absolute; bottom: 0;
            left: 50%; transform: translateX(-50%);
            width: 6px; height: 12px;
            background: linear-gradient(to top, #ff6b35, #ffeb3b 40%, #fff 90%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker calc(0.2s + var(--flicker-speed, 0) * 0.15s) ease-in-out infinite alternate;
            filter: blur(0.3px);
            transition: all 0.3s ease;
            box-shadow: 0 0 6px 2px rgba(255, 200, 50, 0.6);
        }
        .flame::after {
            content: '';
            position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
            width: 8px; height: 6px;
            background: radial-gradient(ellipse, rgba(100, 180, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
        }
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
            33% { transform: translateX(-50%) scale(1.1, 0.85) rotate(2deg); }
            66% { transform: translateX(-50%) scale(0.9, 1.15) rotate(-1deg); }
            100% { transform: translateX(-50%) scale(1.05, 0.95) rotate(3deg); }
        }
        .flame.out {
            animation: blowOut 0.4s ease-out forwards !important;
        }
        @keyframes blowOut {
            0% { transform: translateX(-50%) scale(1); opacity: 1; }
            30% { transform: translateX(-50%) scale(1.8, 0.3) translateX(4px); opacity: 0.7; }
            100% { transform: translateX(-50%) scale(0) translateY(-5px); opacity: 0; }
        }

        /* SMOKE PUFF */
        .smoke-puff {
            position: absolute;
            width: 6px; height: 6px;
            background: rgba(180, 180, 190, 0.5);
            border-radius: 50%;
            left: 50%; top: -2px;
            transform: translateX(-50%);
            animation: smokeRise 0.8s ease-out forwards;
            pointer-events: none;
        }
        @keyframes smokeRise {
            0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 0.5; }
            100% { transform: translateX(-50%) translateY(-18px) scale(2.5); opacity: 0; }
        }

        /* --- CAKE --- */
        .cake {
            position: relative;
            display: flex; flex-direction: column;
            align-items: center;
        }
        .cake-tier {
            position: relative;
            border-radius: 12px 12px 14px 14px;
            overflow: visible;
        }
        .cake-tier-top {
            width: clamp(180px, 50vw, 240px);
            height: 50px;
            background: linear-gradient(180deg, #ffc1cc 0%, #ffb7c5 100%);
            border-bottom: 3px solid #f48fb1;
            z-index: 1;
        }
        .cake-tier-bottom {
            width: clamp(220px, 60vw, 300px);
            height: 65px;
            background: linear-gradient(180deg, #ff91a4 0%, #ff7b93 100%);
            border-bottom: 3px solid #e57395;
            margin-top: -2px;
            border-radius: 14px 14px 16px 16px;
        }
        /* Frosting drips */
        .frosting {
            position: absolute; top: -2px; left: 0; right: 0; height: 14px;
            overflow: visible;
        }
        .frosting::before {
            content: '';
            position: absolute; top: 0; left: 5%; right: 5%; height: 10px;
            background: #ffd1dc;
            border-radius: 0 0 50% 50%;
        }
        .drip {
            position: absolute; top: 8px;
            width: 10px; background: #ffd1dc;
            border-radius: 0 0 50% 50%;
        }
        .drip:nth-child(1) { left: 12%; height: 14px; }
        .drip:nth-child(2) { left: 30%; height: 10px; }
        .drip:nth-child(3) { left: 55%; height: 16px; }
        .drip:nth-child(4) { left: 75%; height: 11px; }
        .drip:nth-child(5) { left: 90%; height: 13px; }

        /* Cake plate */
        .cake-plate {
            width: clamp(250px, 68vw, 340px);
            height: 14px;
            background: linear-gradient(180deg, #e8d5dc 0%, #d4c0c9 100%);
            border-radius: 50%;
            margin-top: -2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Cake decorations (dots) */
        .cake-dots {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            gap: 12px; padding: 0 15px;
        }
        .cake-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: #fff;
            opacity: 0.7;
        }

        /* "21" on cake */
        .cake-number {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        /* --- BLOW BUTTON --- */
        .blow-section {
            display: flex; flex-direction: column;
            align-items: center; gap: 10px;
        }
        .blow-btn {
            font-family: 'Quicksand', sans-serif;
            font-size: 16px; font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #f06292, #ec407a);
            border: none; border-radius: 50px;
            padding: 14px 32px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(236, 64, 122, 0.4);
            transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .blow-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(236, 64, 122, 0.5); }
        .blow-btn:active { transform: translateY(0); }
        .blow-btn.listening {
            animation: btnPulse 1.5s ease-in-out infinite;
            background: linear-gradient(135deg, #ec407a, #e91e63);
        }
        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(236, 64, 122, 0.5); }
            50% { box-shadow: 0 0 0 12px rgba(236, 64, 122, 0); }
        }
        .blow-btn:disabled {
            opacity: 0.5; cursor: default;
            transform: none !important;
            animation: none !important;
        }

        /* Mic visualizer ring */
        .mic-ring {
            position: absolute; inset: -4px;
            border: 2px solid rgba(236, 64, 122, 0.4);
            border-radius: 50px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .blow-btn.listening .mic-ring {
            opacity: 1;
            animation: ringPulse 0.8s ease-out infinite;
        }
        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .blow-hint {
            font-size: 12px; color: #c97b93;
            font-weight: 500;
            opacity: 0; transition: opacity 0.3s;
        }
        .blow-hint.show { opacity: 1; }

        .candle-counter {
            font-size: 13px; color: #d6336c;
            font-weight: 600;
            min-height: 20px;
        }

        /* --- MESSAGE (hidden initially) --- */
        .message-section {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 400px;
            text-align: center;
        }
        .message-section.show {
            display: flex;
            animation: msgFadeIn 1.5s ease-out;
        }
        @keyframes msgFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(28px, 7vw, 44px);
            color: #d6336c;
            text-shadow: 0 2px 15px rgba(214, 51, 108, 0.3);
        }
        .message-text {
            font-size: clamp(14px, 3.5vw, 17px);
            color: #6b3a5a;
            line-height: 1.8;
            font-weight: 500;
        }
        .message-text .typed-cursor {
            display: inline-block;
            width: 2px; height: 1em;
            background: #d6336c;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: cursorBlink 0.8s step-end infinite;
        }
        @keyframes cursorBlink {
            0%, 100% { opacity: 1; } 50% { opacity: 0; }
        }

        /* --- TAP FOR CONFETTI HINT --- */
        .confetti-hint {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-size: 11px; color: rgba(156, 68, 102, 0.5);
            font-weight: 500;
            z-index: 50;
            animation: hintFade 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes hintFade {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 380px) {
            .candles-row { gap: 3px; }
            .candle-body { width: 5px; height: 16px; }
            .flame { width: 5px; height: 10px; }
            .flame-container { width: 10px; height: 13px; }
            .countdown-box { min-width: 60px; padding: 10px 10px; }
        }
        @media (min-height: 800px) {
            .content { gap: 30px; }
        }

        /* --- SAFE AREA (notch phones) --- */
        @supports (padding-top: env(safe-area-inset-top)) {
            .content { padding-top: calc(30px + env(safe-area-inset-top)); }
        }
    </style>
</head>
<body>

    <!-- Background glow blobs -->
    <div class="glow-blob"></div>
    <div class="glow-blob"></div>
    <div class="glow-blob"></div>

    <!-- Sakura petal canvas -->
    <canvas id="sakura-canvas"></canvas>

    <!-- Effects canvas (confetti/fireworks) -->
    <canvas id="effects-canvas"></canvas>

    <!-- Main Content -->
    <div class="content">
        <h1 class="name">Helia</h1>
        <p class="subtitle">Turning 21 on August 15, 2026</p>

        <!-- Countdown -->
        <div class="countdown" id="countdown">
            <div class="countdown-box">
                <div class="countdown-number" id="cd-days">--</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-number" id="cd-hours">--</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-number" id="cd-mins">--</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-number" id="cd-secs">--</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>

        <!-- Birthday banner (shown on the day) -->
        <div class="birthday-banner" id="birthday-banner">
            🎂 It's your birthday! 🎂
        </div>

        <!-- Cake Section -->
        <div class="cake-section" id="cake-section">
            <div class="cake-wrapper">
                <!-- Candles are generated by JS -->
                <div id="candles-container"></div>

                <div class="cake">
                    <div class="cake-tier cake-tier-top">
                        <div class="frosting">
                            <div class="drip"></div>
                            <div class="drip"></div>
                            <div class="drip"></div>
                            <div class="drip"></div>
                            <div class="drip"></div>
                        </div>
                        <div class="cake-dots">
                            <div class="cake-dot"></div>
                            <div class="cake-dot"></div>
                            <div class="cake-dot"></div>
                            <div class="cake-dot"></div>
                            <div class="cake-dot"></div>
                        </div>
                    </div>
                    <div class="cake-tier cake-tier-bottom">
                        <div class="frosting">
                            <div class="drip"></div>
                            <div class="drip"></div>
                            <div class="drip"></div>
                            <div class="drip"></div>
                            <div class="drip"></div>
                            <div class="drip"></div>
                        </div>
                        <div class="cake-number">21</div>
                    </div>
                </div>
                <div class="cake-plate"></div>
            </div>

            <div class="candle-counter" id="candle-counter"></div>

            <div class="blow-section">
                <button class="blow-btn" id="blow-btn">
                    <span class="mic-ring"></span>
                    🎂 Blow out the candles!
                </button>
                <p class="blow-hint" id="blow-hint">Blow into your phone's mic to put out the candles</p>
            </div>
        </div>

        <!-- Message (revealed after all candles out) -->
        <div class="message-section" id="message-section">
            <h2 class="message-title">Happy 21st Birthday, Helia! 🌸</h2>
            <p class="message-text" id="message-text"></p>
        </div>
    </div>

    <div class="confetti-hint" id="confetti-hint">tap anywhere for confetti ✨</div>

    <script>
    (function() {
        // =============================================
        //  CUSTOMIZE THESE!
        // =============================================
        const BIRTHDAY_NAME = 'Helia';
        const BIRTHDAY_DATE = new Date('2026-08-15T00:00:00'); // August 15, 2026
        const AGE = 21;
        const CANDLE_COUNT = 21;

        // EDIT: Your birthday message below
        const BIRTHDAY_MESSAGE =
            'Happy 21st Birthday, ' + BIRTHDAY_NAME + '! \ud83c\udf38 ' +
            'Wishing you a day filled with love, laughter, and all the things that make you smile. ' +
            'Here\'s to 21 years of being absolutely amazing, and to many, many more beautiful years ahead. ' +
            'You deserve the world and more. Love you! \ud83d\udc95';

        // Blowing sensitivity (0.0 - 1.0, lower = more sensitive)
        const BLOW_SENSITIVITY = 0.35;
        // Cooldown between candle extinguishing (ms)
        const BLOW_COOLDOWN = 400;

        // =============================================
        //  STATE
        // =============================================
        let candlesOut = 0;
        let isListening = false;
        let audioCtx = null;
        let analyser = null;
        let micStream = null;
        let lastBlowTime = 0;
        let celebrationDone = false;

        // =============================================
        //  COUNTDOWN
        // =============================================
        const cdDays = document.getElementById('cd-days');
        const cdHours = document.getElementById('cd-hours');
        const cdMins = document.getElementById('cd-mins');
        const cdSecs = document.getElementById('cd-secs');
        const countdownEl = document.getElementById('countdown');
        const bannerEl = document.getElementById('birthday-banner');

        function updateCountdown() {
            const now = new Date();
            const diff = BIRTHDAY_DATE - now;

            if (diff <= 0) {
                // Birthday has arrived!
                countdownEl.style.display = 'none';
                bannerEl.classList.add('show');
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / (1000 * 60)) % 60);
            const secs = Math.floor((diff / 1000) % 60);

            cdDays.textContent = String(days).padStart(2, '0');
            cdHours.textContent = String(hours).padStart(2, '0');
            cdMins.textContent = String(mins).padStart(2, '0');
            cdSecs.textContent = String(secs).padStart(2, '0');
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // =============================================
        //  GENERATE CANDLES
        // =============================================
        const candlesContainer = document.getElementById('candles-container');
        const candleCounter = document.getElementById('candle-counter');

        // Split into 2 rows: back row (11) and front row (10)
        const backCount = Math.ceil(CANDLE_COUNT / 2);
        const frontCount = CANDLE_COUNT - backCount;

        function createCandleRow(count, isBack) {
            const row = document.createElement('div');
            row.className = 'candles-row' + (isBack ? ' back' : '');
            for (let i = 0; i < count; i++) {
                const candle = document.createElement('div');
                candle.className = 'candle';
                candle.innerHTML = `
                    <div class="flame-container">
                        <div class="flame" style="--flicker-speed: ${Math.random()}"></div>
                    </div>
                    <div class="wick"></div>
                    <div class="candle-body"></div>
                `;
                candle.dataset.index = String(candlesOut + i);
                row.appendChild(candle);
            }
            candlesOut += count;
            return row;
        }

        // Reset for actual tracking
        candlesOut = 0;
        const backRow = createCandleRow(backCount, true);
        const frontRow = createCandleRow(frontCount, false);
        candlesContainer.appendChild(backRow);
        candlesContainer.appendChild(frontRow);

        // Reset again for tracking
        candlesOut = 0;
        const allFlames = document.querySelectorAll('.flame');
        const totalCandles = allFlames.length;

        function updateCounter() {
            if (candlesOut > 0 && candlesOut < totalCandles) {
                candleCounter.textContent = `${candlesOut} / ${totalCandles} candles out`;
            } else if (candlesOut === 0) {
                candleCounter.textContent = '';
            } else {
                candleCounter.textContent = '';
            }
        }

        function extinguishCandle() {
            if (candlesOut >= totalCandles) return;
            const flame = allFlames[candlesOut];
            if (!flame || flame.classList.contains('out')) return;

            flame.classList.add('out');

            // Add smoke puff
            const container = flame.parentElement;
            const smoke = document.createElement('div');
            smoke.className = 'smoke-puff';
            container.appendChild(smoke);
            setTimeout(() => smoke.remove(), 800);

            candlesOut++;
            updateCounter();

            if (candlesOut >= totalCandles) {
                onAllCandlesOut();
            }
        }

        // =============================================
        //  BLOW DETECTION (Microphone)
        // =============================================
        const blowBtn = document.getElementById('blow-btn');
        const blowHint = document.getElementById('blow-hint');

        blowBtn.addEventListener('click', startListening);

        async function startListening() {
            if (isListening) {
                stopListening();
                return;
            }

            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(micStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.8;
                source.connect(analyser);

                isListening = true;
                blowBtn.classList.add('listening');
                blowBtn.innerHTML = '<span class="mic-ring"></span>🎤 Listening... (tap to stop)';
                blowHint.classList.add('show');

                detectBlow();
            } catch (err) {
                console.log('Mic access denied or unavailable:', err);
                // Fallback: tap to blow out candles
                blowBtn.innerHTML = '<span class="mic-ring"></span>🔋 Tap to blow out!';
                blowBtn.onclick = () => {
                    extinguishCandle();
                    // Vibrate on mobile
                    if (navigator.vibrate) navigator.vibrate(30);
                };
            }
        }

        function stopListening() {
            isListening = false;
            blowBtn.classList.remove('listening');
            blowBtn.innerHTML = '<span class="mic-ring"></span>🎂 Blow out the candles!';
                blowHint.classList.remove('show');

            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
        }

        function detectBlow() {
            if (!isListening || !analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // Focus on low frequency energy (blowing)
            // Sample rate ~44100, fftSize 2048 → each bin ~21.5Hz
            // Blowing: strong energy in 0-500Hz → first ~23 bins
            const lowBins = 23;
            let lowEnergy = 0;
            let totalEnergy = 0;

            for (let i = 0; i < bufferLength; i++) {
                const val = dataArray[i];
                totalEnergy += val;
                if (i < lowBins) lowEnergy += val;
            }

            const lowRatio = lowEnergy / Math.max(totalEnergy, 1);
            const normalizedLow = lowEnergy / (lowBins * 255);

            // Blow detected: strong low-freq energy above threshold
            const now = Date.now();
            if (normalizedLow > BLOW_SENSITIVITY && lowRatio > 0.3 && (now - lastBlowTime) > BLOW_COOLDOWN) {
                lastBlowTime = now;
                extinguishCandle();
                // Haptic feedback
                if (navigator.vibrate) navigator.vibrate(50);
            }

            requestAnimationFrame(detectBlow);
        }

        // =============================================
        //  CELEBRATION (all candles out)
        // =============================================
        function onAllCandlesOut() {
            if (celebrationDone) return;
            celebrationDone = true;

            // Stop listening
            stopListening();
            blowBtn.disabled = true;
            blowBtn.innerHTML = '✨ Make a wish! ✨';

            // Hide blow hint
            blowHint.classList.remove('show');

            // Launch fireworks
            launchFireworks();

            // Show message after a delay
            setTimeout(() => {
                document.getElementById('cake-section').style.display = 'none';
                const msgSection = document.getElementById('message-section');
                msgSection.classList.add('show');
                typeMessage(BIRTHDAY_MESSAGE);
            }, 3000);

            // More fireworks bursts
            setTimeout(() => launchFireworks(), 1500);
            setTimeout(() => launchFireworks(), 3000);
            setTimeout(() => launchFireworks(), 4500);
        }

        // =============================================
        //  TYPEWRITER MESSAGE
        // =============================================
        function typeMessage(text) {
            const el = document.getElementById('message-text');
            let i = 0;
            const cursor = '<span class="typed-cursor"></span>';

            function type() {
                if (i < text.length) {
                    el.innerHTML = text.substring(0, i + 1) + cursor;
                    i++;
                    const speed = Math.random() * 40 + 30;
                    setTimeout(type, speed);
                } else {
                    // Remove cursor after done
                    setTimeout(() => {
                        el.innerHTML = text;
                    }, 2000);
                }
            }
            type();
        }

        // =============================================
        //  SAKURA PETAL SYSTEM
        // =============================================
        const sakuraCanvas = document.getElementById('sakura-canvas');
        const sCtx = sakuraCanvas.getContext('2d');
        let sWidth, sHeight;
        const petals = [];
        const PETAL_COLORS = ['#ffb7c5', '#ffc1cc', '#f8bbd0', '#ffd1dc', '#f48fb1', '#fce4ec'];
        const MAX_PETALS = window.innerWidth < 500 ? 30 : 50;

        function resizeSakura() {
            sWidth = window.innerWidth;
            sHeight = window.innerHeight;
            sakuraCanvas.width = sWidth;
            sakuraCanvas.height = sHeight;
        }

        class Petal {
            constructor() { this.reset(true); }
            reset(initial) {
                this.x = Math.random() * sWidth;
                this.y = initial ? Math.random() * sHeight : -20;
                this.size = Math.random() * 8 + 5;
                this.speedY = Math.random() * 1.2 + 0.4;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.03;
                this.wobbleAmp = Math.random() * 30 + 10;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                this.wobbleOffset = Math.random() * Math.PI * 2;
                this.opacity = Math.random() * 0.4 + 0.4;
                this.color = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
                this.type = Math.random() > 0.7 ? 'flower' : 'petal'; // 30% chance of full flower
            }
            update(t) {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(t * this.wobbleSpeed + this.wobbleOffset) * 0.5;
                this.rotation += this.rotSpeed;
                if (this.y > sHeight + 20) this.reset(false);
                if (this.x < -20) this.x = sWidth + 20;
                if (this.x > sWidth + 20) this.x = -20;
            }
            draw(ctx, t) {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (this.type === 'flower') {
                    this.drawFlower(ctx);
                } else {
                    this.drawPetal(ctx);
                }

                ctx.restore();
            }
            drawPetal(ctx) {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                const s = this.size;
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(s * 0.5, -s * 0.4, s, 0);
                ctx.quadraticCurveTo(s * 0.5, s * 0.4, 0, 0);
                ctx.fill();
            }
            drawFlower(ctx) {
                const s = this.size * 0.6;
                ctx.fillStyle = this.color;
                for (let i = 0; i < 5; i++) {
                    ctx.save();
                    ctx.rotate((i * 2 * Math.PI) / 5);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(s * 0.35, -s * 0.3, 0, -s * 0.6);
                    ctx.quadraticCurveTo(-s * 0.35, -s * 0.3, 0, 0);
                    ctx.fill();
                    ctx.restore();
                }
                // Center dot
                ctx.fillStyle = '#fff';
                ctx.globalAlpha = this.opacity * 0.8;
                ctx.beginPath();
                ctx.arc(0, 0, s * 0.1, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initPetals() {
            resizeSakura();
            for (let i = 0; i < MAX_PETALS; i++) {
                petals.push(new Petal());
            }
        }

        let sakuraTime = 0;
        function animateSakura() {
            sCtx.clearRect(0, 0, sWidth, sHeight);
            sakuraTime++;
            for (const p of petals) {
                p.update(sakuraTime);
                p.draw(sCtx, sakuraTime);
            }
            requestAnimationFrame(animateSakura);
        }

        window.addEventListener('resize', resizeSakura);
        initPetals();
        animateSakura();

        // =============================================
        //  EFFECTS CANVAS (Confetti + Fireworks)
        // =============================================
        const fxCanvas = document.getElementById('effects-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        let fxWidth, fxHeight;

        function resizeFx() {
            fxWidth = window.innerWidth;
            fxHeight = window.innerHeight;
            fxCanvas.width = fxWidth;
            fxCanvas.height = fxHeight;
        }
        window.addEventListener('resize', resizeFx);
        resizeFx();

        // --- CONFETTI ---
        const confettiPieces = [];
        const CONFETTI_COLORS = ['#f06292', '#ec407a', '#ff80ab', '#ffb7c5', '#ffd54f', '#fff176', '#f8bbd0', '#ce93d8'];

        class ConfettiPiece {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 1) * 10 - 3;
                this.width = Math.random() * 8 + 4;
                this.height = Math.random() * 4 + 2;
                this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.3;
                this.gravity = 0.15;
                this.opacity = 1;
                this.decay = Math.random() * 0.005 + 0.008;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.99;
                this.rotation += this.rotSpeed;
                this.opacity -= this.decay;
            }
            draw(ctx) {
                if (this.opacity <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                ctx.restore();
            }
        }

        function spawnConfetti(x, y, count) {
            count = count || 20;
            for (let i = 0; i < count; i++) {
                confettiPieces.push(new ConfettiPiece(x, y));
            }
        }

        // --- FIREWORKS ---
        const fireworkParticles = [];
        const FW_COLORS = ['#f06292', '#ff80ab', '#ffd54f', '#fff176', '#ce93d8', '#f48fb1', '#ffb7c5', '#ff8a80'];

        class FWParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.opacity = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                this.size = Math.random() * 2.5 + 1;
                this.gravity = 0.04;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.opacity -= this.decay;
            }
            draw(ctx) {
                if (this.opacity <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function launchFireworks() {
            const burstCount = 4 + Math.floor(Math.random() * 3);
            for (let b = 0; b < burstCount; b++) {
                setTimeout(() => {
                    const cx = Math.random() * fxWidth * 0.6 + fxWidth * 0.2;
                    const cy = Math.random() * fxHeight * 0.4 + fxHeight * 0.1;
                    const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
                    const particleCount = 30 + Math.floor(Math.random() * 20);
                    for (let i = 0; i < particleCount; i++) {
                        fireworkParticles.push(new FWParticle(cx, cy, color));
                    }
                }, b * 300);
            }
        }

        // --- EFFECTS ANIMATION LOOP ---
        function animateEffects() {
            fxCtx.clearRect(0, 0, fxWidth, fxHeight);

            // Update & draw confetti
            for (let i = confettiPieces.length - 1; i >= 0; i--) {
                confettiPieces[i].update();
                confettiPieces[i].draw(fxCtx);
                if (confettiPieces[i].opacity <= 0) confettiPieces.splice(i, 1);
            }

            // Update & draw fireworks
            for (let i = fireworkParticles.length - 1; i >= 0; i--) {
                fireworkParticles[i].update();
                fireworkParticles[i].draw(fxCtx);
                if (fireworkParticles[i].opacity <= 0) fireworkParticles.splice(i, 1);
            }

            requestAnimationFrame(animateEffects);
        }
        animateEffects();

        // --- TAP FOR CONFETTI ---
        document.addEventListener('click', (e) => {
            // Don't trigger on buttons
            if (e.target.closest('button')) return;
            spawnConfetti(e.clientX, e.clientY, 15);
        });
        document.addEventListener('touchstart', (e) => {
            if (e.target.closest('button')) return;
            const touch = e.touches[0];
            if (touch) spawnConfetti(touch.clientX, touch.clientY, 15);
        }, { passive: true });

        // Hide confetti hint after a few seconds
        setTimeout(() => {
            const hint = document.getElementById('confetti-hint');
            if (hint) hint.style.opacity = '0';
            setTimeout(() => { if (hint) hint.remove(); }, 1000);
        }, 8000);

    })();
    </script>
</body>
